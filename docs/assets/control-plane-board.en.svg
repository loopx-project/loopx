<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="534" viewBox="0 0 1200 534" role="img" aria-labelledby="title desc"><title id="title">LoopX governed turn: work, evidence and continuation</title><desc id="desc">Read authoritative state, qualify permitted work and receipt identity, execute using the harness, validate the outcome, commit state before accounting, and reassess acceptance. Wait, owner decisions and failed work are distinct branches.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="1200" height="534" fill="#fafafa"/><text x="36" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / THE GOVERNED TURN</text><text x="36" y="90" font-size="37" font-weight="600" fill="#171717" text-anchor="start">Work becomes state. State guides the next turn.</text><circle cx="120" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="120" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">01</text><text x="36" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Read state</text><text x="36" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Goal / acceptance</text><text x="36" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Todo / evidence</text><text x="36" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Owner · scope · quota</text><path d="M141 178H291" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="312" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="312" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">02</text><text x="228" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Qualify turn</text><text x="228" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Capability / gate</text><text x="228" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Claim / lease</text><text x="228" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Bound Turn receipt</text><path d="M333 178H483" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="504" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="504" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">03</text><text x="420" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Harness execution</text><text x="420" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Plan + tools</text><text x="420" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Bounded work slice</text><text x="420" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Runtime context</text><path d="M525 178H675" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="696" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="696" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">04</text><text x="612" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Validate outcome</text><text x="612" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Artifacts + behavior</text><text x="612" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Failure paths</text><text x="612" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Typed transition</text><path d="M717 178H867" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="888" cy="178" r="21" fill="#171717" stroke="#171717"/><text x="888" y="184" font-size="16" font-weight="500" fill="#fff" text-anchor="middle" class="mono">05</text><text x="804" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Commit + account</text><text x="804" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">State + evidence</text><text x="804" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Durable receipt</text><text x="804" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Then quota spend</text><path d="M909 178H1059" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="1080" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="1080" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">06</text><text x="996" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Reassess</text><text x="996" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Acceptance / gap</text><text x="996" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Next Todo / replan</text><text x="996" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Cadence / backoff</text><path d="M36 372L1164 372" stroke="#e2e2e2" fill="none"/><text x="36" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">WAIT</text><text x="36" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Observe with backoff; no spend.</text><text x="412" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">ASK</text><text x="412" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Concrete decision; scoped waiting.</text><text x="788" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">FAILED / UNVERIFIED</text><text x="788" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Retain evidence; recover before completion.</text><path d="M1080 157V132H120V157" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="600" y="124" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="middle">next permitted turn</text><text x="36" y="509" font-size="19" font-weight="500" fill="#171717" text-anchor="start">Todo done ≠ Goal done. Re-check acceptance; continue, replan or stop.</text></svg>
