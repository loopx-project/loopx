<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="534" viewBox="0 0 1200 534" role="img" aria-labelledby="title desc"><title id="title">LoopX 有界工作、证据与续行</title><desc id="desc">Read authoritative state, qualify permitted work and receipt identity, execute using the harness, validate the outcome, commit state before accounting, and reassess acceptance. Wait, owner decisions and failed work are distinct branches.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="1200" height="534" fill="#fafafa"/><text x="36" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / 有据可续的每一轮</text><text x="36" y="90" font-size="37" font-weight="600" fill="#171717" text-anchor="start">把工作变成状态，让状态支撑下一轮。</text><circle cx="120" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="120" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">01</text><text x="36" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">读取状态</text><text x="36" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">目标 / 验收</text><text x="36" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">任务 / 当前证据</text><text x="36" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">责任人 · 范围 · 预算</text><path d="M141 178H291" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="312" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="312" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">02</text><text x="228" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">本轮准入</text><text x="228" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">能力 / gate</text><text x="228" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">claim / lease</text><text x="228" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">绑定本轮工作与回执</text><path d="M333 178H483" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="504" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="504" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">03</text><text x="420" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">Harness 执行</text><text x="420" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">规划 + 工具</text><text x="420" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">有界工作单元</text><text x="420" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">运行时上下文</text><path d="M525 178H675" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="696" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="696" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">04</text><text x="612" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">验证结果</text><text x="612" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">产物 + 真实行为</text><text x="612" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">失败路径</text><text x="612" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">类型化状态提议</text><path d="M717 178H867" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="888" cy="178" r="21" fill="#171717" stroke="#171717"/><text x="888" y="184" font-size="16" font-weight="500" fill="#fff" text-anchor="middle" class="mono">05</text><text x="804" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">写回与记账</text><text x="804" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">状态 + 证据</text><text x="804" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">持久回执</text><text x="804" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">之后 quota 记账</text><path d="M909 178H1059" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="1080" cy="178" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="1080" y="184" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">06</text><text x="996" y="240" font-size="21" font-weight="600" fill="#171717" text-anchor="start">重新判断</text><text x="996" y="274" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">验收 / 缺口</text><text x="996" y="303" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">下一项 Todo / replan</text><text x="996" y="332" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">调度节奏 / 退避</text><path d="M36 372L1164 372" stroke="#e2e2e2" fill="none"/><text x="36" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">等待</text><text x="36" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">调节节奏、退避；纯观察不记账。</text><text x="412" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">问人</text><text x="412" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">具体待决事项；只等受影响路径。</text><text x="788" y="399" font-size="15" font-weight="600" fill="#0070f3" text-anchor="start" class="mono">失败 / 未验证</text><text x="788" y="429" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">保留证据；恢复后再判断完成。</text><path d="M1080 157V132H120V157" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="600" y="124" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="middle">下一轮允许动作</text><text x="36" y="509" font-size="19" font-weight="500" fill="#171717" text-anchor="start">Todo 完成 ≠ Goal 完成；重新检查验收，决定继续、重规划或停止。</text></svg>
