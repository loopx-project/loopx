<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="title desc"><title id="title">LoopX：一个状态内核，多种执行 Harness</title><desc id="desc">Durable goals, work ownership, authority, evidence, scheduling and recovery live in the state kernel. Operator surfaces project this state. The interaction contract admits work for replaceable runtimes. Capabilities validate provider facts and propose transitions; the Kernel commits state and receipts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="1200" height="812" fill="#fafafa"/><text x="36" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / THE LONG-HORIZON LAYER</text><text x="36" y="89" font-size="39" font-weight="600" fill="#171717" text-anchor="start">一个状态内核，多种执行 Harness。</text><path d="M36 121L1164 121" stroke="#e2e2e2" fill="none"/><path d="M36 197L1164 197" stroke="#e2e2e2" fill="none"/><text x="36" y="149" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">操作整份工作</text><text x="368" y="161" font-size="25" font-weight="500" fill="#171717" text-anchor="start">个人工作区  /  飞书 + Lark  /  CLI</text><text x="36" y="280" font-size="22" font-weight="600" fill="#171717" text-anchor="start">人类判断</text><text x="36" y="315" font-size="20" font-weight="400" fill="#171717" text-anchor="start">意图 · 审批</text><text x="36" y="346" font-size="20" font-weight="400" fill="#4d4d4d" text-anchor="start">边界 · 反馈</text><text x="978" y="280" font-size="22" font-weight="600" fill="#171717" text-anchor="start">可读投影</text><text x="978" y="315" font-size="19" font-weight="400" fill="#171717" text-anchor="start">status / diagnose</text><text x="978" y="346" font-size="19" font-weight="400" fill="#4d4d4d" text-anchor="start">review / results</text><path d="M210 322H260" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><path d="M940 322H968" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect data-panel="true" x="260" y="250" width="680" height="250" rx="16" stroke="#171717" fill="#171717"/><text x="286" y="295" font-size="29" font-weight="600" fill="#fff" text-anchor="start">LoopX 状态内核</text><text x="914" y="293" font-size="16" font-weight="500" fill="#8cbcff" text-anchor="end">持久状态权威</text><path d="M286 313H914" stroke="#414141"/><text x="286" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">目标与验收</text><text x="286" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">vision / 范围</text><text x="286" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">成功条件</text><path d="M483.33333333333337 328V404" stroke="#414141"/><text x="495.33333333333337" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">任务与责任</text><text x="495.33333333333337" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">Todo / 依赖</text><text x="495.33333333333337" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">claim / lease</text><path d="M692.6666666666667 328V404" stroke="#414141"/><text x="704.6666666666667" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">授权与决策</text><text x="704.6666666666667" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">gate / 决策作用域</text><text x="704.6666666666667" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">权限 / 写入边界</text><text x="286" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">证据与接续</text><text x="286" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">产物 / 历史</text><text x="286" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">阻塞 / 交接</text><path d="M483.33333333333337 414V490" stroke="#414141"/><text x="495.33333333333337" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">算力与调度</text><text x="495.33333333333337" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">quota / 消耗账本</text><text x="495.33333333333337" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">节奏 / 退避</text><path d="M692.6666666666667 414V490" stroke="#414141"/><text x="704.6666666666667" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">恢复与续行</text><text x="704.6666666666667" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">回执 / 重放</text><text x="704.6666666666667" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">下一步 / replan</text><path d="M390 500V543" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><rect data-panel="true" x="260" y="543" width="680" height="75" rx="8" stroke="#b7d5fb" fill="#f1f7ff"/><text x="282" y="572" font-size="22" font-weight="600" fill="#171717" text-anchor="start">交互契约</text><text x="282" y="601" font-size="17" font-weight="400" fill="#4d4d4d" text-anchor="start">should_run  ·  scope / capability gates  ·  scheduler_hint  ·  spend policy</text><path d="M390 618V691" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="410" y="654" font-size="17" font-weight="500" fill="#0070f3" text-anchor="start">允许的动作</text><rect data-panel="true" x="260" y="691" width="680" height="89" rx="8" stroke="#e2e2e2" fill="#fff"/><text x="600" y="674" font-size="15" font-weight="500" fill="#4d4d4d" text-anchor="middle" class="mono">执行层 / HARNESS</text><text x="280" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Codex</text><text x="388" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Claude Code</text><text x="518" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">DeepSeek Harness</text><text x="695" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">OpenCode / Pi</text><text x="830" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Custom</text><text x="280" y="761" font-size="17" font-weight="400" fill="#4d4d4d" text-anchor="start">模型、工具与会话上下文，由运行时提供。</text><path d="M842 691V644H956V452H940" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="928" y="670" font-size="17" font-weight="500" fill="#0070f3" text-anchor="end">经过验证的状态提议</text><text x="978" y="544" font-size="22" font-weight="600" fill="#171717" text-anchor="start">证据回流</text><text x="978" y="579" font-size="18" font-weight="400" fill="#171717" text-anchor="start">Provider 事实</text><text x="978" y="610" font-size="18" font-weight="400" fill="#171717" text-anchor="start">Capability 验证</text><text x="978" y="641" font-size="18" font-weight="400" fill="#171717" text-anchor="start">提议 → 内核提交</text><text x="978" y="672" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">回执 → 记账</text></svg>
