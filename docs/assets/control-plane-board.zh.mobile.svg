<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc"><title id="title">LoopX 有界工作、证据与续行</title><desc id="desc">Read authoritative state, qualify permitted work and receipt identity, execute using the harness, validate the outcome, commit state before accounting, and reassess acceptance. Wait, owner decisions and failed work are distinct branches.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="640" height="1510" fill="#fafafa"/><text x="24" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / 有据可续的每一轮</text><text x="24" y="80" font-size="33" font-weight="600" fill="#171717" text-anchor="start">把工作变成状态，</text><text x="24" y="121" font-size="33" font-weight="600" fill="#171717" text-anchor="start">让状态支撑下一轮。</text><circle cx="60" cy="202" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="60" y="208" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">01</text><text x="106" y="195" font-size="27" font-weight="600" fill="#171717" text-anchor="start">读取状态</text><text x="106" y="229" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">目标 / 验收</text><text x="106" y="260" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">任务 / 当前证据</text><text x="106" y="291" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">责任人 · 范围 · 预算</text><path d="M60 223V332" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="60" cy="353" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="60" y="359" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">02</text><text x="106" y="346" font-size="27" font-weight="600" fill="#171717" text-anchor="start">本轮准入</text><text x="106" y="380" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">能力 / gate</text><text x="106" y="411" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">claim / lease</text><text x="106" y="442" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">绑定本轮工作与回执</text><path d="M60 374V483" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="60" cy="504" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="60" y="510" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">03</text><text x="106" y="497" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Harness 执行</text><text x="106" y="531" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">规划 + 工具</text><text x="106" y="562" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">有界工作单元</text><text x="106" y="593" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">运行时上下文</text><path d="M60 525V634" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="60" cy="655" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="60" y="661" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">04</text><text x="106" y="648" font-size="27" font-weight="600" fill="#171717" text-anchor="start">验证结果</text><text x="106" y="682" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">产物 + 真实行为</text><text x="106" y="713" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">失败路径</text><text x="106" y="744" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">类型化状态提议</text><path d="M60 676V785" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="60" cy="806" r="21" fill="#171717" stroke="#171717"/><text x="60" y="812" font-size="16" font-weight="500" fill="#fff" text-anchor="middle" class="mono">05</text><text x="106" y="799" font-size="27" font-weight="600" fill="#171717" text-anchor="start">写回与记账</text><text x="106" y="833" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">状态 + 证据</text><text x="106" y="864" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">持久回执</text><text x="106" y="895" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">之后 quota 记账</text><path d="M60 827V936" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><circle cx="60" cy="957" r="21" fill="#f1f7ff" stroke="#b7d5fb"/><text x="60" y="963" font-size="16" font-weight="500" fill="#0070f3" text-anchor="middle" class="mono">06</text><text x="106" y="950" font-size="27" font-weight="600" fill="#171717" text-anchor="start">重新判断</text><text x="106" y="984" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">验收 / 缺口</text><text x="106" y="1015" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">下一项 Todo / replan</text><text x="106" y="1046" font-size="23" font-weight="400" fill="#4d4d4d" text-anchor="start">调度节奏 / 退避</text><path d="M24 1169L616 1169" stroke="#e2e2e2" fill="none"/><text x="24" y="1196" font-size="23" font-weight="600" fill="#0070f3" text-anchor="start">等待</text><text x="24" y="1230" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">调节节奏、退避；纯观察不记账。</text><text x="24" y="1281" font-size="23" font-weight="600" fill="#0070f3" text-anchor="start">问人</text><text x="24" y="1315" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">具体待决事项；只等受影响路径。</text><text x="24" y="1366" font-size="23" font-weight="600" fill="#0070f3" text-anchor="start">失败 / 未验证</text><text x="24" y="1400" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">保留证据；恢复后再判断完成。</text><path d="M600 950H624V186H600" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="24" y="1485" font-size="21" font-weight="500" fill="#171717" text-anchor="start">Todo 完成 ≠ Goal 完成；重新检查验收。</text></svg>
