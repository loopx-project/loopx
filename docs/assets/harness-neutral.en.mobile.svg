<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1606" viewBox="0 0 640 1606" role="img" aria-labelledby="title desc"><title id="title">LoopX: one state kernel, your choice of harness</title><desc id="desc">Create work directly from a Codex session through the LoopX skill, or from CLI and Workspace. Goals and tasks enter the same durable state kernel. Workspace, Lark and CLI operate this state. The kernel retains goals, work ownership, authority, evidence, scheduling and recovery. The interaction contract admits work for replaceable runtimes. Capabilities validate provider facts and propose transitions; the kernel commits state and receipts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="640" height="1606" fill="#fafafa"/><text x="24" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / THE LONG-HORIZON LAYER</text><text x="24" y="80" font-size="34" font-weight="600" fill="#171717" text-anchor="start">One state kernel.</text><text x="24" y="121" font-size="34" font-weight="600" fill="#171717" text-anchor="start">Your choice of harness.</text><path d="M24 144L616 144" stroke="#e2e2e2" fill="none"/><text x="24" y="172" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">CREATE THE WORK</text><text x="24" y="207" font-size="24" font-weight="500" fill="#171717" text-anchor="start">Codex session  /  CLI  /  Workspace</text><text x="24" y="238" font-size="20" font-weight="500" fill="#4d4d4d" text-anchor="start">LoopX skill → goals &amp; tasks in the same kernel</text><text x="24" y="277" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">OPERATE THE WORK</text><text x="24" y="311" font-size="24" font-weight="500" fill="#171717" text-anchor="start">Workspace  /  Lark  /  CLI</text><path d="M24 333L616 333" stroke="#e2e2e2" fill="none"/><g transform="translate(0 96)"><text x="24" y="282" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Human judgment</text><text x="24" y="317" font-size="20" font-weight="400" fill="#171717" text-anchor="start">Intent · approvals</text><text x="24" y="348" font-size="20" font-weight="400" fill="#4d4d4d" text-anchor="start">Scope · feedback</text><text x="336" y="282" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Readable views</text><text x="336" y="317" font-size="19" font-weight="400" fill="#171717" text-anchor="start">status / diagnose</text><text x="336" y="348" font-size="19" font-weight="400" fill="#4d4d4d" text-anchor="start">review / results</text><path d="M170 351V374" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><path d="M472 374V351" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect data-panel="true" x="24" y="374" width="592" height="544" rx="16" stroke="#171717" fill="#171717"/><text x="50" y="419" font-size="29" font-weight="600" fill="#fff" text-anchor="start">LoopX state kernel</text><text x="590" y="417" font-size="16" font-weight="500" fill="#8cbcff" text-anchor="end">PERSISTED TRUTH</text><path d="M50 437H590" stroke="#414141"/><text x="50" y="477" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Goal &amp; acceptance</text><text x="50" y="507" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">vision · scope · success criteria</text><path d="M50 523H590" stroke="#343434"/><text x="50" y="550" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Work &amp; ownership</text><text x="50" y="580" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">todos · dependencies · claims · leases</text><path d="M50 596H590" stroke="#343434"/><text x="50" y="623" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Authority &amp; decisions</text><text x="50" y="653" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">gates · decision scopes · write limits</text><path d="M50 669H590" stroke="#343434"/><text x="50" y="696" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Evidence &amp; continuity</text><text x="50" y="726" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">artifacts · history · blockers · handoffs</text><path d="M50 742H590" stroke="#343434"/><text x="50" y="769" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Compute &amp; scheduling</text><text x="50" y="799" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">quota · spend ledger · cadence · backoff</text><path d="M50 815H590" stroke="#343434"/><text x="50" y="842" font-size="26" font-weight="600" fill="#fff" text-anchor="start">Recovery &amp; continuation</text><text x="50" y="872" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">receipt replay · next action · replan</text><path d="M154 918V965" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><rect data-panel="true" x="24" y="965" width="592" height="104" rx="8" stroke="#b7d5fb" fill="#f1f7ff"/><text x="46" y="994" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Interaction contract</text><text x="46" y="1027" font-size="22" font-weight="400" fill="#171717" text-anchor="start">should_run · gate · scheduler_hint</text><text x="46" y="1054" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">Permitted work · scope · spend policy</text><path d="M154 1069V1150" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="174" y="1117" font-size="22" font-weight="500" fill="#0070f3" text-anchor="start">permitted action</text><rect data-panel="true" x="24" y="1150" width="592" height="238" rx="8" stroke="#e2e2e2" fill="#fff"/><text x="320" y="1180" font-size="21" font-weight="500" fill="#4d4d4d" text-anchor="middle" class="mono">EXECUTION / HARNESS</text><text x="44" y="1230" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Codex App / CLI</text><text x="322" y="1230" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Claude Code</text><text x="44" y="1275" font-size="23" font-weight="500" fill="#171717" text-anchor="start">DeepSeek Harness</text><text x="322" y="1275" font-size="23" font-weight="500" fill="#171717" text-anchor="start">OpenCode / Pi</text><text x="44" y="1320" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Custom runner</text><text x="44" y="1369" font-size="21" font-weight="400" fill="#4d4d4d" text-anchor="start">Models · tools · session context stay with the runtime.</text><path d="M518 1150V1095H632V870H616" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="604" y="1121" font-size="21" font-weight="500" fill="#0070f3" text-anchor="end">validated transition</text><text x="24" y="1400" font-size="22" font-weight="500" fill="#171717" text-anchor="start">Capabilities validate provider facts.</text><text x="24" y="1432" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">Kernel commits state; receipts enable replay.</text></g></svg>
