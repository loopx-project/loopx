<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1606" viewBox="0 0 640 1606" role="img" aria-labelledby="title desc"><title id="title">LoopX：一个状态内核，多种执行 Harness</title><desc id="desc">可在 Codex 会话中通过 LoopX skill 直接创建工作，也可从 CLI 与工作区创建。目标与任务进入同一个持久状态内核，工作区、飞书与 CLI 操作这份状态。内核保留目标、任务责任、授权、证据、调度与恢复；交互契约为可替换运行时准入工作。Capability 验证 Provider 事实并提议状态变更，内核提交状态与回执。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="640" height="1606" fill="#fafafa"/><text x="24" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / THE LONG-HORIZON LAYER</text><text x="24" y="80" font-size="34" font-weight="600" fill="#171717" text-anchor="start">一个状态内核，</text><text x="24" y="121" font-size="34" font-weight="600" fill="#171717" text-anchor="start">多种执行 Harness。</text><path d="M24 144L616 144" stroke="#e2e2e2" fill="none"/><text x="24" y="172" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">创建工作</text><text x="24" y="207" font-size="24" font-weight="500" fill="#171717" text-anchor="start">Codex 会话  /  CLI  /  工作区</text><text x="24" y="238" font-size="20" font-weight="500" fill="#4d4d4d" text-anchor="start">LoopX skill → 目标与任务写入同一内核</text><text x="24" y="277" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">操作工作</text><text x="24" y="311" font-size="24" font-weight="500" fill="#171717" text-anchor="start">个人工作区  /  飞书  /  CLI</text><path d="M24 333L616 333" stroke="#e2e2e2" fill="none"/><g transform="translate(0 96)"><text x="24" y="282" font-size="22" font-weight="600" fill="#171717" text-anchor="start">人类判断</text><text x="24" y="317" font-size="20" font-weight="400" fill="#171717" text-anchor="start">意图 · 审批</text><text x="24" y="348" font-size="20" font-weight="400" fill="#4d4d4d" text-anchor="start">边界 · 反馈</text><text x="336" y="282" font-size="22" font-weight="600" fill="#171717" text-anchor="start">可读投影</text><text x="336" y="317" font-size="19" font-weight="400" fill="#171717" text-anchor="start">status / diagnose</text><text x="336" y="348" font-size="19" font-weight="400" fill="#4d4d4d" text-anchor="start">review / results</text><path d="M170 351V374" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><path d="M472 374V351" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect data-panel="true" x="24" y="374" width="592" height="544" rx="16" stroke="#171717" fill="#171717"/><text x="50" y="419" font-size="29" font-weight="600" fill="#fff" text-anchor="start">LoopX 状态内核</text><text x="590" y="417" font-size="16" font-weight="500" fill="#8cbcff" text-anchor="end">持久状态权威</text><path d="M50 437H590" stroke="#414141"/><text x="50" y="477" font-size="26" font-weight="600" fill="#fff" text-anchor="start">目标与验收</text><text x="50" y="507" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">vision · 范围 · 成功条件</text><path d="M50 523H590" stroke="#343434"/><text x="50" y="550" font-size="26" font-weight="600" fill="#fff" text-anchor="start">任务与责任</text><text x="50" y="580" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">Todo · 依赖 · claim · lease</text><path d="M50 596H590" stroke="#343434"/><text x="50" y="623" font-size="26" font-weight="600" fill="#fff" text-anchor="start">授权与决策</text><text x="50" y="653" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">gate · 决策作用域 · 写入边界</text><path d="M50 669H590" stroke="#343434"/><text x="50" y="696" font-size="26" font-weight="600" fill="#fff" text-anchor="start">证据与接续</text><text x="50" y="726" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">产物 · 历史 · 阻塞 · 交接</text><path d="M50 742H590" stroke="#343434"/><text x="50" y="769" font-size="26" font-weight="600" fill="#fff" text-anchor="start">算力与调度</text><text x="50" y="799" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">quota · 消耗账本 · 节奏 · 退避</text><path d="M50 815H590" stroke="#343434"/><text x="50" y="842" font-size="26" font-weight="600" fill="#fff" text-anchor="start">恢复与续行</text><text x="50" y="872" font-size="22" font-weight="400" fill="#c6c6c6" text-anchor="start">回执重放 · 下一步 · replan</text><path d="M154 918V965" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><rect data-panel="true" x="24" y="965" width="592" height="104" rx="8" stroke="#b7d5fb" fill="#f1f7ff"/><text x="46" y="994" font-size="22" font-weight="600" fill="#171717" text-anchor="start">交互契约</text><text x="46" y="1027" font-size="22" font-weight="400" fill="#171717" text-anchor="start">should_run · gate · scheduler_hint</text><text x="46" y="1054" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">允许的工作 · 范围 · 记账规则</text><path d="M154 1069V1150" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="174" y="1117" font-size="22" font-weight="500" fill="#0070f3" text-anchor="start">允许的动作</text><rect data-panel="true" x="24" y="1150" width="592" height="238" rx="8" stroke="#e2e2e2" fill="#fff"/><text x="320" y="1180" font-size="21" font-weight="500" fill="#4d4d4d" text-anchor="middle" class="mono">执行层 / HARNESS</text><text x="44" y="1230" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Codex App / CLI</text><text x="322" y="1230" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Claude Code</text><text x="44" y="1275" font-size="23" font-weight="500" fill="#171717" text-anchor="start">DeepSeek Harness</text><text x="322" y="1275" font-size="23" font-weight="500" fill="#171717" text-anchor="start">OpenCode / Pi</text><text x="44" y="1320" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Custom runner</text><text x="44" y="1369" font-size="21" font-weight="400" fill="#4d4d4d" text-anchor="start">模型、工具与会话上下文，由运行时提供。</text><path d="M518 1150V1095H632V870H616" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="604" y="1121" font-size="21" font-weight="500" fill="#0070f3" text-anchor="end">经过验证的状态提议</text><text x="24" y="1400" font-size="22" font-weight="500" fill="#171717" text-anchor="start">Capability 验证 Provider 的事实。</text><text x="24" y="1432" font-size="22" font-weight="400" fill="#4d4d4d" text-anchor="start">内核提交状态；持久回执支持恢复。</text></g></svg>
