<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" role="img" aria-labelledby="title desc"><title id="title">LoopX: one state kernel, your choice of harness</title><desc id="desc">Create work directly from a Codex session through the LoopX skill, or from CLI and Workspace. Goals and tasks enter the same durable state kernel. Workspace, Lark and CLI operate this state. The kernel retains goals, work ownership, authority, evidence, scheduling and recovery. The interaction contract admits work for replaceable runtimes. Capabilities validate provider facts and propose transitions; the kernel commits state and receipts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0070f3"/></marker><style>text{font-family:Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Arial,sans-serif}.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}</style></defs><rect width="1200" height="812" fill="#fafafa"/><text x="36" y="36" font-size="15" font-weight="500" fill="#0070f3" text-anchor="start" class="mono">LOOPX / THE LONG-HORIZON LAYER</text><text x="36" y="89" font-size="39" font-weight="600" fill="#171717" text-anchor="start">One state kernel. Your choice of harness.</text><path d="M36 121L1164 121" stroke="#e2e2e2" fill="none"/><text x="36" y="151" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">CREATE THE WORK</text><text x="368" y="155" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Codex session  /  CLI  /  Workspace</text><text x="368" y="180" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start">LoopX skill → goals &amp; tasks in the same kernel</text><text x="36" y="217" font-size="16" font-weight="500" fill="#4d4d4d" text-anchor="start" class="mono">OPERATE THE WORK</text><text x="368" y="217" font-size="23" font-weight="500" fill="#171717" text-anchor="start">Workspace  /  Lark  /  CLI</text><path d="M36 237L1164 237" stroke="#e2e2e2" fill="none"/><text x="36" y="280" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Human judgment</text><text x="36" y="315" font-size="20" font-weight="400" fill="#171717" text-anchor="start">Intent · approvals</text><text x="36" y="346" font-size="20" font-weight="400" fill="#4d4d4d" text-anchor="start">Scope · feedback</text><text x="978" y="280" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Readable views</text><text x="978" y="315" font-size="19" font-weight="400" fill="#171717" text-anchor="start">status / diagnose</text><text x="978" y="346" font-size="19" font-weight="400" fill="#4d4d4d" text-anchor="start">review / results</text><path d="M210 322H260" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><path d="M940 322H968" stroke="#777" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect data-panel="true" x="260" y="250" width="680" height="250" rx="16" stroke="#171717" fill="#171717"/><text x="286" y="295" font-size="29" font-weight="600" fill="#fff" text-anchor="start">LoopX state kernel</text><text x="914" y="293" font-size="16" font-weight="500" fill="#8cbcff" text-anchor="end">PERSISTED TRUTH</text><path d="M286 313H914" stroke="#414141"/><text x="286" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Goals</text><text x="286" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">vision / scope</text><text x="286" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">acceptance criteria</text><path d="M483.33333333333337 328V404" stroke="#414141"/><text x="495.33333333333337" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Work</text><text x="495.33333333333337" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">todos / dependencies</text><text x="495.33333333333337" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">claims / leases</text><path d="M692.6666666666667 328V404" stroke="#414141"/><text x="704.6666666666667" y="350" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Authority</text><text x="704.6666666666667" y="376" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">gates / decision scopes</text><text x="704.6666666666667" y="397" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">permissions / write limits</text><text x="286" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Evidence</text><text x="286" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">artifacts / history</text><text x="286" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">blockers / handoffs</text><path d="M483.33333333333337 414V490" stroke="#414141"/><text x="495.33333333333337" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Scheduling</text><text x="495.33333333333337" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">quota / spend ledger</text><text x="495.33333333333337" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">cadence / backoff</text><path d="M692.6666666666667 414V490" stroke="#414141"/><text x="704.6666666666667" y="436" font-size="21" font-weight="600" fill="#fff" text-anchor="start">Recovery</text><text x="704.6666666666667" y="462" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">receipts / replay</text><text x="704.6666666666667" y="483" font-size="16" font-weight="400" fill="#c6c6c6" text-anchor="start">next action / replan</text><path d="M390 500V543" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><rect data-panel="true" x="260" y="543" width="680" height="75" rx="8" stroke="#b7d5fb" fill="#f1f7ff"/><text x="282" y="572" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Interaction contract</text><text x="282" y="601" font-size="17" font-weight="400" fill="#4d4d4d" text-anchor="start">should_run  ·  scope / capability gates  ·  scheduler_hint  ·  spend policy</text><path d="M390 618V691" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="410" y="654" font-size="17" font-weight="500" fill="#0070f3" text-anchor="start">permitted action</text><rect data-panel="true" x="260" y="691" width="680" height="89" rx="8" stroke="#e2e2e2" fill="#fff"/><text x="600" y="674" font-size="15" font-weight="500" fill="#4d4d4d" text-anchor="middle" class="mono">EXECUTION / HARNESS</text><text x="280" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Codex</text><text x="388" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Claude Code</text><text x="518" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">DeepSeek Harness</text><text x="695" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">OpenCode / Pi</text><text x="830" y="727" font-size="18" font-weight="500" fill="#171717" text-anchor="start">Custom</text><text x="280" y="761" font-size="17" font-weight="400" fill="#4d4d4d" text-anchor="start">Models · tools · session context stay with the runtime.</text><path d="M842 691V644H956V452H940" stroke="#0070f3" stroke-width="2" fill="none" marker-end="url(#blue)"/><text x="928" y="670" font-size="17" font-weight="500" fill="#0070f3" text-anchor="end">validated transition</text><text x="978" y="544" font-size="22" font-weight="600" fill="#171717" text-anchor="start">Evidence return</text><text x="978" y="579" font-size="18" font-weight="400" fill="#171717" text-anchor="start">Provider facts</text><text x="978" y="610" font-size="18" font-weight="400" fill="#171717" text-anchor="start">Capability validates</text><text x="978" y="641" font-size="18" font-weight="400" fill="#171717" text-anchor="start">Typed → Kernel</text><text x="978" y="672" font-size="18" font-weight="400" fill="#4d4d4d" text-anchor="start">Receipt → accounting</text></svg>
