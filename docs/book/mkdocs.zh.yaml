INHERIT: ../../mkdocs.yaml

site_name: LoopX · Developer Book
site_url: https://loopx-project.github.io/loopx/docs/book/
docs_dir: .
site_dir: ../../output/docs-book-zh
edit_uri: edit/main/docs/book/

exclude_docs: |
  en/**

# Capability pages belong to the root docs site. Keep this inherited config on
# the Developer Book's own source tree.
plugins:
  - search
hooks: []

theme:
  name: material
  language: zh
  font: false
  logo: /loopx/docs/assets/loopx-logo.png
  favicon: /loopx/docs/assets/loopx-logo.png
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到浅色模式
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-2
        name: 切换到深色模式
  features:
    - content.action.edit
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - /loopx/docs/stylesheets/loopx.css

extra:
  alternate:
    - name: 简体中文
      link: /loopx/docs/book/
      lang: zh
    - name: English
      link: /loopx/docs/book/en/
      lang: en

nav:
  - 首页: index.md
  - 开始:
      - Welcome Wagon: welcome-wagon.md
      - LoopX 1.0 Workspace: chapters/workspace-v1.md
      - 如何使用本书: chapters/00-reading-guide.md
  - 开发者课程:
      - Control-Plane Course: chapters/12-control-plane-course.md
  - 第一部分：控制面基础:
      - 1. 从一次会话到长程任务: chapters/01-from-session-to-loop.md
      - 2. 会话、Codex Goal 与 LoopX: chapters/02-session-goal-loopx.md
      - 3. 持久状态与只读投影: chapters/state-substrate.md
      - 4. 工作图、权限与 Peer 协作: chapters/work-graph-and-authority.md
      - 专题：主要状态机与流转: chapters/core-state-machines.md
      - 5. 一轮受治理的工作: chapters/03-one-turn.md
      - 6. 恢复、自修复与运行边界: chapters/04-runtime-boundaries.md
  - 第二部分：接入现有项目:
      - 7. 连接你的 Git 项目: chapters/05-connect-existing-project.md
      - 8. 从 Codex App 启动: chapters/06-codex-app.md
      - 9. 从 Codex CLI 启动: chapters/07-codex-cli.md
  - 第三部分：开发者贡献:
      - 10. 开发者贡献地图与协议入口: chapters/source-protocol-map.md
      - 11. 沿一条协议链定位实现: chapters/source-trace-protocol-chain.md
      - 12. 修改一条 Control-Plane 规则: chapters/source-change-control-plane-rule.md
      - 13. 从聚焦验证到 PR: chapters/source-validation-to-pr.md
      - 14. 先选择正确的放置位置: chapters/08-extension-placement.md
      - 15. 创建 standalone Extension: chapters/09-extension-scaffold.md
      - 16. 生命周期与 managed runtime: chapters/10-extension-lifecycle.md
  - 第四部分：工程边界:
      - 17. 验证、兼容与安全: chapters/11-engineering-boundaries.md
      - 附录：术语与命令入口: chapters/appendix-reference.md
