[package]
name = "loopx-control-plane"
version = "0.1.0"
description = "Thin desktop shell for the LoopX personal Agent workspace"
authors = ["LoopX contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "loopx_control_plane"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "loopx-control-plane"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
command-group = "5.0.1"
open = "5.4.4"
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.0"
tempfile = "3.27.0"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
