<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">02  What looked green, and what was true</title>
<desc id="desc">Five rows. For each incident: the green signal the system showed, the red fact that was true, and the envelope or capture field that now makes it visible.</desc>
<g font-family="Geist, Inter, Helvetica Neue, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="720" fill="#fafafa"/>
<text x="40.0" y="49.0" font-size="28" fill="#171717" font-weight="600" text-anchor="start">02  What looked green, and what was true</text>
<text x="40.0" y="84.0" font-size="17" fill="#4d4d4d" font-weight="400" text-anchor="start">Every signal the agent relied on was accurate about its own layer. None of them described freshness.</text>
<text x="84.0" y="128.0" font-size="13" fill="#4d4d4d" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">What the system showed</text>
<text x="318.0" y="128.0" font-size="13" fill="#4d4d4d" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">What was true</text>
<text x="690.0" y="128.0" font-size="13" fill="#4d4d4d" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">What makes it visible now</text>
<rect x="40" y="144" width="920" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="60" cy="194" r="12" fill="#d93036"/>
<text x="60.0" y="199.0" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">1</text>
<rect x="84" y="162" width="214" height="64" rx="8" fill="#e7f5ec"/>
<text x="98.0" y="188.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">✓ doctor healthy</text>
<text x="98.0" y="210.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">   profile enabled</text>
<rect x="310" y="162" width="366" height="64" rx="8" fill="#fdeded"/>
<text x="324.0" y="188.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">Sources last scanned 9 days earlier;</text>
<text x="324.0" y="210.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">the answer came from a settled projection.</text>
<text x="690.0" y="188.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">last_read_at + window</text>
<text x="690.0" y="210.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">→ stale_sources</text>
<rect x="40" y="256" width="920" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="60" cy="306" r="12" fill="#d93036"/>
<text x="60.0" y="311.0" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">2</text>
<rect x="84" y="274" width="214" height="64" rx="8" fill="#e7f5ec"/>
<text x="98.0" y="311.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">✓ Decision Context enabled</text>
<rect x="310" y="274" width="366" height="64" rx="8" fill="#fdeded"/>
<text x="324.0" y="300.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">External providers were never bound in</text>
<text x="324.0" y="322.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">the runtime; nothing could be read.</text>
<text x="690.0" y="300.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">read_status = not_read</text>
<text x="690.0" y="322.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">→ missing_required_sources</text>
<rect x="40" y="368" width="920" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="60" cy="418" r="12" fill="#d93036"/>
<text x="60.0" y="423.0" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">3</text>
<rect x="84" y="386" width="214" height="64" rx="8" fill="#e7f5ec"/>
<text x="98.0" y="412.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">✓ capture enabled</text>
<text x="98.0" y="434.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">   "checked" times advancing</text>
<rect x="310" y="386" width="366" height="64" rx="8" fill="#fdeded"/>
<text x="324.0" y="412.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">Host pinned to a deleted checkout, failing</text>
<text x="324.0" y="434.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">every tick; "all sources" skipped 8 of 38.</text>
<text x="690.0" y="412.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">last_success_at ≠ checked_at</text>
<text x="690.0" y="434.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">host heartbeat · not_scanned</text>
<rect x="40" y="480" width="920" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="60" cy="530" r="12" fill="#d93036"/>
<text x="60.0" y="535.0" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">4</text>
<rect x="84" y="498" width="214" height="64" rx="8" fill="#e7f5ec"/>
<text x="98.0" y="535.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">✓ provider read: ok</text>
<rect x="310" y="498" width="366" height="64" rx="8" fill="#fdeded"/>
<text x="324.0" y="524.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">Only profile metadata came back;</text>
<text x="324.0" y="546.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">every post body was empty.</text>
<text x="690.0" y="524.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">unreadable_count &gt; 0</text>
<text x="690.0" y="546.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">→ partially_unreadable</text>
<rect x="40" y="592" width="920" height="100" rx="12" fill="#fff" stroke="#ebebeb"/>
<circle cx="60" cy="642" r="12" fill="#d93036"/>
<text x="60.0" y="647.0" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">5</text>
<rect x="84" y="610" width="214" height="64" rx="8" fill="#e7f5ec"/>
<text x="98.0" y="636.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">✓ global summary rendered</text>
<text x="98.0" y="658.0" font-size="15" fill="#1a7f37" font-weight="500" text-anchor="start">   capture status normal</text>
<rect x="310" y="610" width="366" height="64" rx="8" fill="#fdeded"/>
<text x="324.0" y="636.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">Summary read 1 project's registry (1 of 48</text>
<text x="324.0" y="658.0" font-size="15" fill="#d93036" font-weight="500" text-anchor="start">goals); 1,000 stuck batches starved the rest.</text>
<text x="690.0" y="636.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">coverage 1/48 · omitted 47</text>
<text x="690.0" y="658.0" font-size="14" fill="#0070f3" font-weight="500" text-anchor="start" font-family="Geist Mono, JetBrains Mono, SFMono-Regular, monospace">source isolation (#4763)</text>
</g>
</svg>
