<text x="72" y="142" font-size="63" fill="#171717" font-weight="600" >通用长程能力，是 RSI 的先决条件</text>
<text x="72" y="197" font-size="30" fill="#4d4d4d" font-weight="400" >用改善后的系统，继续改善系统。</text>
