<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
  <title id="t">CLI for Agents: a state-machine contract, not terminal prose</title>
  <desc id="d">Four pillars of LoopX's Agent-facing CLI: shared Turn decision owner, sealed projection_envelope separating completeness from display truncation, prefix-KV and RPC economics, and strict dry-run purity plus CAS and operation_id replay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0070f3"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <style>
    text { font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .sub { fill: #4d4d4d; }
    .blue { fill: #0070f3; }
    .green { fill: #047857; }
    .on-dark { fill: #ffffff; }
    .on-dark-sub { fill: #e5e5e5; }
    .on-dark-muted { fill: #a3a3a3; }
    .on-dark-dim { fill: #d4d4d4; }
    .on-dark-sky { fill: #93c5fd; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", monospace; }
    .box { fill: #fff; stroke: #d5d5d5; stroke-width: 1.2; }
    .box-hi { fill: #f3f8ff; stroke: #93c5fd; stroke-width: 1.4; }
    .box-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.4; }
    .flow { fill: none; stroke: #0070f3; stroke-width: 1.8; marker-end: url(#arrow); }
    .flow-ok { fill: none; stroke: #047857; stroke-width: 1.8; marker-end: url(#arrowGreen); }
  </style>

  <text x="42" y="52" font-size="29" font-weight="600">CLI for Agents: a state-machine contract, not terminal prose</text>
  <text x="42" y="86" font-size="17" class="sub">Bounded stdout, sealed completeness, prefix-KV preservation, and CAS + idempotent receipt replay</text>

  <!-- Left Actor: LLM Agent -->
  <rect x="42" y="124" width="250" height="404" rx="12" fill="#171717"/>
  <text x="64" y="162" font-size="20" font-weight="600" class="on-dark">LLM Agent Turn</text>
  <text x="64" y="190" font-size="14" class="on-dark-muted">Amnesic, literalist consumer</text>

  <text x="64" y="228" font-size="14" class="on-dark">• Every stdout byte enters</text>
  <text x="76" y="249" font-size="14" class="on-dark-dim">prompt &amp; prefix KV cache</text>

  <text x="64" y="284" font-size="14" class="on-dark">• Unlabeled truncation looks</text>
  <text x="76" y="305" font-size="14" class="on-dark-dim">like “0 tasks remaining”</text>

  <text x="64" y="340" font-size="14" class="on-dark">• Timeouts &amp; previews trigger</text>
  <text x="76" y="361" font-size="14" class="on-dark-dim">literalist retry loops</text>

  <rect x="60" y="388" width="214" height="120" rx="8" fill="#262626" stroke="#404040"/>
  <text x="76" y="416" font-size="12.5" class="mono on-dark-sky">Prefix-KV Fold (#9213)</text>
  <text x="76" y="442" font-size="13.5" class="on-dark-sub">Early prefix untouched;</text>
  <text x="76" y="464" font-size="13.5" class="on-dark-sub">completed Todo suffix folds</text>
  <text x="76" y="486" font-size="13.5" class="on-dark-sub">into verified receipt μ</text>

  <!-- Pillar 1 -->
  <rect class="box-hi" x="336" y="124" width="350" height="186" rx="12"/>
  <text x="358" y="154" font-size="12.5" font-weight="500" class="mono blue">01 · SHARED DECISION OWNER</text>
  <text x="358" y="184" font-size="19" font-weight="600">One Turn plan &amp; repair CLI</text>
  <text x="358" y="214" font-size="15" class="sub">should-run · run-once · managed-step</text>
  <text x="358" y="240" font-size="15" class="sub">22k-row RPC: 2.35 MB → 959 B (#7462)</text>
  <text x="358" y="266" font-size="15" class="sub">Copy-runnable closeout &amp; lease hints</text>
  <text x="358" y="293" font-size="13" class="mono sub">#4496 · #6212 · #8855 · #9136 · #9293</text>

  <!-- Pillar 2 -->
  <rect class="box" x="712" y="124" width="346" height="186" rx="12"/>
  <text x="734" y="154" font-size="12.5" font-weight="500" class="mono blue">02 · SEALED PROJECTION ENVELOPE</text>
  <text x="734" y="184" font-size="19" font-weight="600">Completeness ≠ truncation</text>
  <text x="734" y="214" font-size="15" class="sub">1-tx todo.read evaluates full source</text>
  <text x="734" y="240" font-size="15" class="sub">truncated:true never fakes 0 left</text>
  <text x="734" y="266" font-size="15" class="sub">observed_at vs served_at honesty</text>
  <text x="734" y="293" font-size="13" class="mono sub">#5085 · #5087 · #6679 · #6874</text>

  <!-- Pillar 3 -->
  <rect class="box" x="712" y="342" width="346" height="186" rx="12"/>
  <text x="734" y="372" font-size="12.5" font-weight="500" class="mono blue">03 · CONTEXT &amp; RPC ECONOMICS</text>
  <text x="734" y="402" font-size="19" font-weight="600">Progressive deltas &amp; 1 RPC</text>
  <text x="734" y="432" font-size="15" class="sub">&gt;=1 KiB SHA-256 subtree dedup (#7196)</text>
  <text x="734" y="458" font-size="15" class="sub">Append-only Todo note suffixes (#8523)</text>
  <text x="734" y="484" font-size="15" class="sub">Status N+1 collapsed to 1 todo.read</text>
  <text x="734" y="511" font-size="13" class="mono sub">#6123 · #8100 · #9103 · #9392</text>

  <!-- Pillar 4 -->
  <rect class="box-ok" x="336" y="342" width="350" height="186" rx="12"/>
  <text x="358" y="372" font-size="12.5" font-weight="500" class="mono green">04 · PURITY, CAS &amp; REPLAY</text>
  <text x="358" y="402" font-size="19" font-weight="600">Pure dry-run &amp; exact CAS</text>
  <text x="358" y="432" font-size="15" class="sub">--dry-run fires zero write hooks (#8685)</text>
  <text x="358" y="458" font-size="15" class="sub">Unconsumed claim refused at 0 spend</text>
  <text x="358" y="484" font-size="14" class="mono sub">--expected-revision + --operation-id</text>
  <text x="358" y="511" font-size="13" class="mono sub">#4094 · #8310 · #8776 · #9263 · #9433</text>

  <!-- Loop connectors -->
  <path class="flow" d="M292 214 H330"/>
  <path class="flow" d="M686 214 H706"/>
  <path class="flow" d="M885 310 V336"/>
  <path class="flow-ok" d="M712 435 H692"/>
  <path class="flow-ok" d="M336 435 H298"/>

  <text x="42" y="590" font-size="16" class="sub">Base/head differential CLI budget gates (#6123, #9103) verify bytes, lines, JSON keys, and action digests on every PR.</text>
</svg>
