<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
  <title id="t">CLI for Agents: a state-machine contract, not terminal prose</title>
  <desc id="d">Four pillars of LoopX's Agent-facing CLI: one shared decision source with runnable recovery commands, honest completeness separated from display truncation, output budgets and suffix-only folding preserving prefix KV cache, and read-only previews plus CAS and idempotent receipt replay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0070f3"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <style>
    text { font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .sub { fill: #4d4d4d; }
    .blue { fill: #0070f3; }
    .green { fill: #047857; }
    .on-dark { fill: #ffffff; }
    .on-dark-sub { fill: #e5e5e5; }
    .on-dark-muted { fill: #a3a3a3; }
    .on-dark-dim { fill: #d4d4d4; }
    .on-dark-sky { fill: #93c5fd; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", monospace; }
    .box { fill: #fff; stroke: #d5d5d5; stroke-width: 1.2; }
    .box-hi { fill: #f3f8ff; stroke: #93c5fd; stroke-width: 1.4; }
    .box-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.4; }
    .flow { fill: none; stroke: #0070f3; stroke-width: 1.8; marker-end: url(#arrow); }
    .flow-ok { fill: none; stroke: #047857; stroke-width: 1.8; marker-end: url(#arrowGreen); }
  </style>

  <text x="42" y="52" font-size="29" font-weight="600">CLI for Agents: a state-machine contract, not terminal prose</text>
  <text x="42" y="86" font-size="17" class="sub">Runnable recovery, honest completeness, prefix-KV suffix folding, and CAS + idempotent receipt replay</text>

  <!-- Left Actor: LLM Agent -->
  <rect x="42" y="124" width="250" height="404" rx="12" fill="#171717"/>
  <text x="62" y="162" font-size="20" font-weight="600" class="on-dark">LLM Agent Turn</text>
  <text x="62" y="190" font-size="13.5" class="on-dark-muted">Stateless, literalist caller</text>

  <text x="62" y="228" font-size="14" class="on-dark">• Every stdout byte enters</text>
  <text x="74" y="249" font-size="14" class="on-dark-dim">prompt &amp; prefix KV cache</text>

  <text x="62" y="284" font-size="14" class="on-dark">• Unlabeled truncation looks</text>
  <text x="74" y="305" font-size="14" class="on-dark-dim">like “0 tasks remaining”</text>

  <text x="62" y="340" font-size="14" class="on-dark">• Side-effecting previews &amp;</text>
  <text x="74" y="361" font-size="14" class="on-dark-dim">timeouts cause retry loops</text>

  <rect x="58" y="388" width="218" height="120" rx="8" fill="#262626" stroke="#404040"/>
  <text x="72" y="416" font-size="12.5" class="mono on-dark-sky">Suffix Fold (#9213)</text>
  <text x="72" y="442" font-size="13" class="on-dark-sub">Early prefix stays frozen;</text>
  <text x="72" y="464" font-size="13" class="on-dark-sub">finished task suffix folds</text>
  <text x="72" y="486" font-size="13" class="on-dark-sub">into a verified receipt</text>

  <!-- Pillar 1 -->
  <rect class="box-hi" x="336" y="124" width="350" height="186" rx="12"/>
  <text x="358" y="154" font-size="12" font-weight="500" class="mono blue">01 · SINGLE DECISION SOURCE</text>
  <text x="358" y="184" font-size="18.5" font-weight="600">Runnable recovery, not prose</text>
  <text x="358" y="214" font-size="14.5" class="sub">Plan, step &amp; settle share one view</text>
  <text x="358" y="240" font-size="14.5" class="sub">Copy-runnable repair CLI hints</text>
  <text x="358" y="266" font-size="14.5" class="sub">22k-row RPC: 2.35 MB → 959 B (#7462)</text>
  <text x="358" y="293" font-size="13" class="mono sub">#4496 · #4595 · #6212 · #7462</text>

  <!-- Pillar 2 -->
  <rect class="box" x="712" y="124" width="346" height="186" rx="12"/>
  <text x="734" y="154" font-size="12" font-weight="500" class="mono blue">02 · HONEST READ COMPLETENESS</text>
  <text x="734" y="184" font-size="18.5" font-weight="600">Display limit ≠ work finished</text>
  <text x="734" y="214" font-size="14.5" class="sub">Kernel-sealed freshness &amp; coverage</text>
  <text x="734" y="240" font-size="14.5" class="sub">Full-graph check before --limit cap</text>
  <text x="734" y="266" font-size="14.5" class="sub">Truncated view ≠ missing-source alert</text>
  <text x="734" y="293" font-size="13" class="mono sub">#5085 · #5087 · #6679 · #6874</text>

  <!-- Pillar 3 -->
  <rect class="box" x="712" y="342" width="346" height="186" rx="12"/>
  <text x="734" y="372" font-size="12" font-weight="500" class="mono blue">03 · CONTEXT &amp; KV-CACHE BUDGETS</text>
  <text x="734" y="402" font-size="18.5" font-weight="600">Output gates &amp; suffix folding</text>
  <text x="734" y="432" font-size="14.5" class="sub">Hard byte/line &amp; diff gates (#2144)</text>
  <text x="734" y="458" font-size="14.5" class="sub">&gt;=1 KiB SHA-256 subtree dedup (#7196)</text>
  <text x="734" y="484" font-size="14.5" class="sub">Suffix fold keeps prefix KV (#9213)</text>
  <text x="734" y="511" font-size="13" class="mono sub">#2144 · #6123 · #7196 · #9213</text>

  <!-- Pillar 4 -->
  <rect class="box-ok" x="336" y="342" width="350" height="186" rx="12"/>
  <text x="358" y="372" font-size="12" font-weight="500" class="mono green">04 · READ PURITY &amp; IDEMPOTENT CAS</text>
  <text x="358" y="402" font-size="18.5" font-weight="600">Pure dry-run &amp; exact replay</text>
  <text x="358" y="432" font-size="14.5" class="sub">Single write; keep rejections (#4286)</text>
  <text x="358" y="458" font-size="14.5" class="sub">--dry-run triggers zero writes (#8685)</text>
  <text x="358" y="484" font-size="14.5" class="sub">Explicit CAS revision + replay key</text>
  <text x="358" y="511" font-size="13" class="mono sub">#4094 · #4286 · #7088 · #8685</text>

  <!-- Loop connectors -->
  <path class="flow" d="M292 214 H330"/>
  <path class="flow" d="M686 214 H706"/>
  <path class="flow" d="M885 310 V336"/>
  <path class="flow-ok" d="M712 435 H692"/>
  <path class="flow-ok" d="M336 435 H298"/>

  <text x="42" y="590" font-size="16" class="sub">Every PR enforces CLI stdout budgets (#2144) and base/head semantic output diffs (#6123) across crowded fixtures.</text>
</svg>
