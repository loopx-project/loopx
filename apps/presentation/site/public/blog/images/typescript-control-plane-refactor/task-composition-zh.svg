<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="t d">
  <title id="t">正交任务原语在同一套 TypeScript 语义内核上乘积组合</title>
  <desc id="d">六组正交原语域——User Gate × Fallback、Lineage × Successor、Acceptance × Cadence、Scoped Resume × Lease、Background Monitor 与 Vision × Replan——作为乘积状态机在同一套 TypeScript Effect 与任务语义内核上协同运行，底层连接 AuthorityStore 与只追加执行账本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0070f3"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <style>
    text { font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .sub { fill: #4d4d4d; }
    .blue { fill: #0070f3; }
    .on-dark { fill: #ffffff; }
    .on-dark-sub { fill: #e5e5e5; }
    .on-dark-sky { fill: #93c5fd; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", monospace; }
    .tag { font-family: "Geist Mono", "SFMono-Regular", monospace; fill: #0070f3; letter-spacing: -0.15px; }
    .tray { fill: #f3f6fb; stroke: #dbeafe; stroke-width: 1.2; }
    .box { fill: #fff; stroke: #d5d5d5; stroke-width: 1.2; }
    .box-hi { fill: #f3f8ff; stroke: #93c5fd; stroke-width: 1.4; }
    .kernel { fill: #171717; stroke: #171717; }
    .flow { fill: none; stroke: #0070f3; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>

  <text x="42" y="50" font-size="27" font-weight="600">正交任务原语在同一套 TypeScript 语义内核上乘积组合</text>
  <text x="42" y="82" font-size="15.8" class="sub">乘积状态机（×）守住四类不可坍缩的提交事实，既打破静态工作流 DAG 锁死，又消除跨轮死锁</text>

  <!-- 2x3 Orthogonal Primitive Domains Tray -->
  <rect class="tray" x="30" y="100" width="1040" height="364" rx="16"/>

  <!-- Card 1: User Gate × Fallback (Centerpiece) -->
  <rect class="box-hi" x="42" y="114" width="320" height="160" rx="12"/>
  <text x="56" y="142" font-size="10.1" font-weight="500" class="tag">USER GATE × FALLBACK · #4292 #5277 #6327 #8844</text>
  <text x="56" y="170" font-size="17.5" font-weight="600">作用域门禁 × 人机双通道</text>
  <text x="56" y="198" font-size="13.8" class="sub">类型化 decision scope 门禁 (#4292)</text>
  <text x="56" y="223" font-size="13.8" class="sub">零消耗提问并行 scoped fallback</text>
  <text x="56" y="248" font-size="13.8" class="sub">审批仅核销对应受控范围 (#8844)</text>

  <!-- Card 2: Lineage × Successor -->
  <rect class="box" x="390" y="114" width="320" height="160" rx="12"/>
  <text x="404" y="142" font-size="10.1" font-weight="500" class="tag">LINEAGE × SUCCESSOR · #4184 #5698 #5831 #8896</text>
  <text x="404" y="170" font-size="17.5" font-weight="600">动态谱系 × 强制后继派生</text>
  <text x="404" y="198" font-size="13.8" class="sub">原子 supersede 关联并释租 (#5698)</text>
  <text x="404" y="223" font-size="13.8" class="sub">清障无后继强制 successor replan</text>
  <text x="404" y="248" font-size="13.8" class="sub">回滚追加补偿事件保谱系 (#4184)</text>

  <!-- Card 3: Acceptance × Cadence -->
  <rect class="box" x="738" y="114" width="320" height="160" rx="12"/>
  <text x="752" y="142" font-size="10.1" font-weight="500" class="tag">ACCEPTANCE × CADENCE · #3058 #6357 #6784 #9165</text>
  <text x="752" y="170" font-size="17.5" font-weight="600">外部验收 × 8 档自适应节拍</text>
  <text x="752" y="198" font-size="13.8" class="sub">外部 acceptance oracle 判定 (#6784)</text>
  <text x="752" y="223" font-size="13.8" class="sub">实时纠偏与 Yardstick 防刷分 (#9165)</text>
  <text x="752" y="248" font-size="13.8" class="sub">8 档退避遇 reset token 归零 (#6787)</text>

  <!-- Card 4: Scoped Resume × Lease -->
  <rect class="box" x="42" y="290" width="320" height="160" rx="12"/>
  <text x="56" y="318" font-size="10.1" font-weight="500" class="tag">SCOPED RESUME × LEASE · #4094 #6874 #8231 #9488</text>
  <text x="56" y="346" font-size="17.5" font-weight="600">分目标唤醒 × 跨租约续跑</text>
  <text x="56" y="374" font-size="13.8" class="sub">单事务原子求值完整依赖图 (#6874)</text>
  <text x="56" y="399" font-size="13.8" class="sub">分目标唤醒代际 &lt;=128 防误唤醒 (#8231)</text>
  <text x="56" y="424" font-size="13.8" class="sub">同主重领 fenced lease takeover</text>

  <!-- Card 5: Background Monitor -->
  <rect class="box" x="390" y="290" width="320" height="160" rx="12"/>
  <text x="404" y="318" font-size="10.1" font-weight="500" class="tag">BACKGROUND MONITOR · #4178 #4335 #5450 #9320</text>
  <text x="404" y="346" font-size="17.5" font-weight="600">隔离后台监控 × 零消耗观测</text>
  <text x="404" y="374" font-size="13.8" class="sub">局部编辑不重触发已完监控 (#4178)</text>
  <text x="404" y="399" font-size="13.8" class="sub">分离静默心跳与任务轮询回执 (#5450)</text>
  <text x="404" y="424" font-size="13.8" class="sub">独立后台通道免 LLM healthcheck</text>

  <!-- Card 6: Vision × Replan -->
  <rect class="box" x="738" y="290" width="320" height="160" rx="12"/>
  <text x="752" y="318" font-size="10.1" font-weight="500" class="tag">VISION × REPLAN · #4902 #5633 #8588 #8854</text>
  <text x="752" y="346" font-size="17.5" font-weight="600">目标优先 Vision × 自指重规划</text>
  <text x="752" y="374" font-size="13.8" class="sub">Vision 优先于静默并拒空确认 (#5633)</text>
  <text x="752" y="399" font-size="13.8" class="sub">重规划内退役监控仍保触发源 (#8854)</text>
  <text x="752" y="424" font-size="13.8" class="sub">派生停机前先结清当轮回执 (#8588)</text>

  <!-- Arrows into TS Kernel -->
  <path class="flow" d="M202 464 V492"/>
  <path class="flow" d="M550 464 V492"/>
  <path class="flow" d="M898 464 V492"/>

  <!-- Central TypeScript Effect & Task Semantics Kernel -->
  <rect class="kernel" x="42" y="498" width="1016" height="116" rx="12"/>
  <text x="66" y="532" font-size="19.5" font-weight="600" class="on-dark">TypeScript Effect &amp; Task Semantics Kernel（语义与效应内核）</text>
  <text x="66" y="561" font-size="13.8" class="mono on-dark-sky">GoalState =&gt; F[Decision] (#2905) · Todo 完成 ≠ Turn 结算 ≠ Peer 送达 ≠ Goal 验收</text>
  <text x="66" y="589" font-size="14" class="on-dark-sub">乘积组合不变量（#6874, #7298, #9176）：版本号 CAS · 3h 租约围栏（#9487）· 人机双通道正交 · 停机前结清回执</text>

  <!-- Arrows into Storage & Journal -->
  <path class="flow" d="M290 614 V646"/>
  <path class="flow" d="M810 614 V646"/>

  <!-- Bottom Left: AuthorityStore -->
  <rect class="box-hi" x="42" y="652" width="494" height="106" rx="12"/>
  <text x="66" y="685" font-size="18" font-weight="600">事务状态存储（AuthorityStore）</text>
  <text x="66" y="713" font-size="14.5" class="sub">原子提交状态头、活跃租约、有界归档与操作回执</text>
  <text x="66" y="739" font-size="13" class="mono sub">#3798 · #4121 · #5805 · #7834 · #9223</text>

  <!-- Bottom Right: Execution Journal -->
  <rect class="box" x="564" y="652" width="494" height="106" rx="12"/>
  <text x="588" y="685" font-size="18" font-weight="600">只追加执行账本（Append-Only Execution Journal）</text>
  <text x="588" y="713" font-size="14.5" class="sub">外部副作用两阶段预检与崩溃后原回执恢复</text>
  <text x="588" y="739" font-size="13" class="mono sub">#3416 · #3464 · #3485 · #4286</text>

  <text x="42" y="794" font-size="15.5" class="sub">正交原语在单次事务内乘积组合：既让人机审批不冻死全局支线，又让长程计划在运行中途安全演进。</text>
</svg>
