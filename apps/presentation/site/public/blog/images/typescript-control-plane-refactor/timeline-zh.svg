<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">两个月，三条交错推进的工程线</title><desc id="d">Overlapping transaction, authority/storage, and Semantics tracks from August to October.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d4d4d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#fafafa"/><style>text{font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.sub{fill:#4d4d4d}.blue{fill:#0070f3}.mono{font-family:"Geist Mono","SFMono-Regular",monospace}.line{stroke:#4d4d4d;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#d5d5d5;stroke-width:1}</style><text x="42" y="58" font-size="32" font-weight="600" class="">两个月，三条交错推进的工程线</text><text x="42" y="96" font-size="18" font-weight="400" class="sub">公开合并历史的代表节点 · 路线并行，未标记所有工作已完成</text><text x="280" y="160" font-size="21" font-weight="600" class="blue">8 月中下旬</text><text x="540" y="160" font-size="21" font-weight="600" class="blue">9 月</text><text x="820" y="160" font-size="21" font-weight="600" class="blue">10 月</text><text x="42" y="250" font-size="20" font-weight="600" class="">事务与调用方</text><rect class="box" x="270" y="210" width="247" height="94" rx="12"/><text x="292" y="248" font-size="18" font-weight="600" class="">Effect Program</text><text x="292" y="280" font-size="16" font-weight="400" class="sub">完整事务 / preflight</text><rect class="box" x="530" y="210" width="247" height="94" rx="12"/><text x="552" y="248" font-size="18" font-weight="600" class="">Todo / quota / lease</text><text x="552" y="280" font-size="16" font-weight="400" class="sub">真实 producer</text><rect class="box" x="810" y="210" width="247" height="94" rx="12"/><text x="832" y="248" font-size="18" font-weight="600" class="">调用方收敛</text><text x="832" y="280" font-size="16" font-weight="400" class="sub">普通旧 writer 退役</text><text x="42" y="375" font-size="20" font-weight="600" class="">权威与存储</text><rect class="box" x="270" y="335" width="247" height="94" rx="12"/><text x="292" y="373" font-size="18" font-weight="600" class="">Coordination core</text><text x="292" y="405" font-size="16" font-weight="400" class="sub">Reference / recovery</text><rect class="box" x="530" y="335" width="247" height="94" rx="12"/><text x="552" y="373" font-size="18" font-weight="600" class="">AuthorityStore / SQLite</text><text x="552" y="405" font-size="16" font-weight="400" class="sub">Checkpoint + delta</text><rect class="box" x="810" y="335" width="247" height="94" rx="12"/><text x="832" y="373" font-size="18" font-weight="600" class="">新建默认值</text><text x="832" y="405" font-size="16" font-weight="400" class="sub">恢复与成本验证</text><text x="42" y="500" font-size="20" font-weight="600" class="">Semantics</text><rect class="box" x="270" y="460" width="247" height="94" rx="12"/><text x="292" y="498" font-size="18" font-weight="600" class="">迁移规则逐步收敛</text><text x="292" y="530" font-size="16" font-weight="400" class="sub"> </text><rect class="box" x="530" y="460" width="247" height="94" rx="12"/><text x="552" y="498" font-size="18" font-weight="600" class="">Song: RFC / registry</text><text x="552" y="530" font-size="16" font-weight="400" class="sub">Producer / unknown</text><rect class="box" x="810" y="460" width="247" height="94" rx="12"/><text x="832" y="498" font-size="18" font-weight="600" class="">绑定与解释继续收敛</text><text x="832" y="530" font-size="16" font-weight="400" class="sub">持续修复反例</text><text x="42" y="605" font-size="19" font-weight="400" class="sub">08.15 正式 RFC → 10 月中旬集中退役；#6396 是收尾阶段。</text></svg>