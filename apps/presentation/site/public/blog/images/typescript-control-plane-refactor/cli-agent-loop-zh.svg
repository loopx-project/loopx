<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
  <title id="t">面向 Agent 的 CLI：状态机合同，而非人类终端文本</title>
  <desc id="d">LoopX 面向 Agent 的 CLI 四大支柱：返回可执行恢复命令的单一决策信源、区分展示截断与任务完成的诚实读取、输出预算门禁与保护前缀 KV 缓存的后缀折叠，以及纯只读预检与 CAS 加操作 ID 幂等重放。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0070f3"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <style>
    text { font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .sub { fill: #4d4d4d; }
    .blue { fill: #0070f3; }
    .green { fill: #047857; }
    .on-dark { fill: #ffffff; }
    .on-dark-sub { fill: #e5e5e5; }
    .on-dark-muted { fill: #a3a3a3; }
    .on-dark-dim { fill: #d4d4d4; }
    .on-dark-sky { fill: #93c5fd; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", monospace; }
    .box { fill: #fff; stroke: #d5d5d5; stroke-width: 1.2; }
    .box-hi { fill: #f3f8ff; stroke: #93c5fd; stroke-width: 1.4; }
    .box-ok { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.4; }
    .flow { fill: none; stroke: #0070f3; stroke-width: 1.8; marker-end: url(#arrow); }
    .flow-ok { fill: none; stroke: #047857; stroke-width: 1.8; marker-end: url(#arrowGreen); }
  </style>

  <text x="42" y="52" font-size="29" font-weight="600">面向 Agent 的 CLI：状态机合同，而非人类终端文本</text>
  <text x="42" y="86" font-size="17" class="sub">可执行恢复指令、截断与完成分离、保护前缀 KV 的后缀折叠，以及 CAS 与幂等回执重放</text>

  <!-- Left Actor: LLM Agent -->
  <rect x="42" y="124" width="250" height="404" rx="12" fill="#171717"/>
  <text x="62" y="162" font-size="20" font-weight="600" class="on-dark">LLM Agent 调用方</text>
  <text x="62" y="190" font-size="13.5" class="on-dark-muted">跨轮无隐式记忆 · 按字面解析</text>

  <text x="62" y="228" font-size="14" class="on-dark">• 每字节 stdout 直接计入</text>
  <text x="74" y="249" font-size="14" class="on-dark-dim">上下文窗口与前缀 KV 缓存</text>

  <text x="62" y="284" font-size="14" class="on-dark">• 未标记截断的列表在字面上</text>
  <text x="74" y="305" font-size="14" class="on-dark-dim">等同于“剩余任务为零”</text>

  <text x="62" y="340" font-size="14" class="on-dark">• 预检副作用与超时丢包极易</text>
  <text x="74" y="361" font-size="14" class="on-dark-dim">触发盲目猜参和重复写入</text>

  <rect x="58" y="388" width="218" height="120" rx="8" fill="#262626" stroke="#404040"/>
  <text x="72" y="416" font-size="12.5" class="mono on-dark-sky">后缀回执折叠 (#9213)</text>
  <text x="72" y="442" font-size="13" class="on-dark-sub">早期前缀字节保持冻结；</text>
  <text x="72" y="464" font-size="13" class="on-dark-sub">已完结任务后缀原子折叠</text>
  <text x="72" y="486" font-size="13" class="on-dark-sub">为保留失败事实的回执</text>

  <!-- Pillar 1 -->
  <rect class="box-hi" x="336" y="124" width="350" height="186" rx="12"/>
  <text x="358" y="154" font-size="12" font-weight="500" class="mono blue">01 · 单一决策信源与恢复指令</text>
  <text x="358" y="184" font-size="18.5" font-weight="600">返回可执行命令，而非报错文本</text>
  <text x="358" y="214" font-size="14.5" class="sub">准入、单步与结算共享同一状态快照</text>
  <text x="358" y="240" font-size="14.5" class="sub">阻断时直接投影可复制执行的恢复命令</text>
  <text x="358" y="266" font-size="14.5" class="sub">2.2 万行动作载荷：2.35 MB → 959 B</text>
  <text x="358" y="293" font-size="13" class="mono sub">#4496 · #4595 · #6212 · #7462</text>

  <!-- Pillar 2 -->
  <rect class="box" x="712" y="124" width="346" height="186" rx="12"/>
  <text x="734" y="154" font-size="12" font-weight="500" class="mono blue">02 · 诚实完整度与截断分离</text>
  <text x="734" y="184" font-size="18.5" font-weight="600">展示行数上限 ≠ 任务全部完成</text>
  <text x="734" y="214" font-size="14.5" class="sub">由内核统一密封新鲜度与覆盖率证明</text>
  <text x="734" y="240" font-size="14.5" class="sub">在 --limit 截断前先对全量集合求值</text>
  <text x="734" y="266" font-size="14.5" class="sub">严格区分正常展示截断与信源漏读告警</text>
  <text x="734" y="293" font-size="13" class="mono sub">#5085 · #5087 · #6679 · #6874</text>

  <!-- Pillar 3 -->
  <rect class="box" x="712" y="342" width="346" height="186" rx="12"/>
  <text x="734" y="372" font-size="12" font-weight="500" class="mono blue">03 · 输出预算与前缀 KV 经济学</text>
  <text x="734" y="402" font-size="18.5" font-weight="600">体积差分门禁与后缀回执折叠</text>
  <text x="734" y="432" font-size="14.5" class="sub">严格校验字节、行数与语义差分 (#2144)</text>
  <text x="734" y="458" font-size="14.5" class="sub">跨轮次 &gt;=1 KiB 未变子树摘要去重</text>
  <text x="734" y="484" font-size="14.5" class="sub">仅折叠已完成任务后缀保住前缀 KV</text>
  <text x="734" y="511" font-size="13" class="mono sub">#2144 · #6123 · #7196 · #9213</text>

  <!-- Pillar 4 -->
  <rect class="box-ok" x="336" y="342" width="350" height="186" rx="12"/>
  <text x="358" y="372" font-size="12" font-weight="500" class="mono green">04 · 读写纯净与 CAS 幂等重放</text>
  <text x="358" y="402" font-size="18.5" font-weight="600">纯只读预检与乐观并发重放</text>
  <text x="358" y="432" font-size="14.5" class="sub">单次写入尝试，断连不丢冲突拒绝 (#4286)</text>
  <text x="358" y="458" font-size="14.5" class="sub">--dry-run 零写钩子、零日志污染 (#8685)</text>
  <text x="358" y="484" font-size="14.5" class="sub">显式期望版本 CAS + 幂等键重放回执</text>
  <text x="358" y="511" font-size="13" class="mono sub">#4094 · #4286 · #7088 · #8685</text>

  <!-- Loop connectors -->
  <path class="flow" d="M292 214 H330"/>
  <path class="flow" d="M686 214 H706"/>
  <path class="flow" d="M885 310 V336"/>
  <path class="flow-ok" d="M712 435 H692"/>
  <path class="flow-ok" d="M336 435 H298"/>

  <text x="42" y="590" font-size="16" class="sub">每次 PR 在多任务拥挤夹具上校验 CLI 输出预算（#2144）与 base/head 语义差分门禁（#6123）。</text>
</svg>
