<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">恢复原操作，检查当前执行权</title><desc id="d">职责示意 · 原回执只证明原结果；已选 provider 故障不能静默回退</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d4d4d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#fafafa"/><style>text{font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.sub{fill:#4d4d4d}.blue{fill:#0070f3}.mono{font-family:"Geist Mono","SFMono-Regular",monospace}.line{stroke:#4d4d4d;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#d5d5d5;stroke-width:1}</style><text x="42" y="58" font-size="32" font-weight="600" class="">恢复原操作，检查当前执行权</text><text x="42" y="96" font-size="19" font-weight="400" class="sub">职责示意 · 原回执只证明原结果；已选 provider 故障不能静默回退</text><rect class="box" x="42" y="150" width="274" height="110" rx="12"/><text x="64" y="188" font-size="21" font-weight="600" class="">解码 / 定位权威</text><text x="64" y="220" font-size="18" font-weight="400" class="sub">校验身份与 provider</text><rect class="box" x="404" y="150" width="274" height="110" rx="12"/><text x="426" y="188" font-size="21" font-weight="600" class="">匹配原回执？</text><text x="426" y="220" font-size="18" font-weight="400" class="sub">operation + intent</text><rect class="box" x="777" y="150" width="281" height="110" rx="12"/><text x="799" y="188" font-size="21" font-weight="600" class="">恢复原结果</text><text x="799" y="220" font-size="18" font-weight="400" class="sub">保持后来写入</text><path class="line" d="M316 207H391"/><path class="line" d="M678 207H765"/><text x="705" y="190" font-size="18" font-weight="400" class="blue">是</text><rect class="box" x="404" y="390" width="274" height="132" rx="12"/><text x="426" y="428" font-size="21" font-weight="600" class="">新工作准入</text><text x="426" y="460" font-size="18" font-weight="400" class="sub">当前 owner