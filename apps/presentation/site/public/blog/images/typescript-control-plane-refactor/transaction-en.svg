<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">Give the complete transaction one owner</title><desc id="d">Responsibility schematic · Explicit external validation; not a full CLI call trace</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4d4d4d" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#fafafa"/><style>text{font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.sub{fill:#4d4d4d}.blue{fill:#0070f3}.mono{font-family:"Geist Mono","SFMono-Regular",monospace}.line{stroke:#4d4d4d;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#d5d5d5;stroke-width:1}</style><text x="42" y="58" font-size="32" font-weight="600" class="">Give the complete transaction one owner</text><text x="42" y="96" font-size="19" font-weight="400" class="sub">Responsibility schematic · Explicit external validation; not a full CLI call trace</text><rect class="box" x="42" y="151" width="230" height="112" rx="12"/><text x="64" y="189" font-size="21" font-weight="600" class="">Caller intent</text><text x="64" y="221" font-size="18" font-weight="400" class="sub">Identity / version / facts</text><rect class="box" x="351" y="138" width="412" height="222" rx="12"/><text x="373" y="176" font-size="21" font-weight="600" class="">TypeScript transaction</text><text x="373" y="208" font-size="18" font-weight="400" class="sub">Decode → admit → plan</text><text x="373" y="240" font-size="18" font-weight="400" class="sub">Recheck → CAS commit</text><text x="373" y="272" font-size="18" font-weight="400" class="sub">State + lease + receipt</text><rect class="box" x="842" y="151" width="216" height="112" rx="12"/><text x="864" y="189" font-size="21" font-weight="600" class="">Result + receipt</text><text x="864" y="221" font-size="18" font-weight="400" class="sub">Recoverable display</text><path class="line" d="M272 207H339"/><path class="line" d="M763 207H830"/><rect class="box" x="351" y="430" width="412" height="106" rx="12"/><text x="373" y="468" font-size="21" font-weight="600" class="">Named external provider (optional)</text><text x="373" y="500" font-size="18" font-weight="400" class="sub">Execute declared validation; return facts</text><path class="line" d="M477 360V417"/><text x="368" y="393" font-size="17" font-weight="400" class="mono">preflight</text><path class="line" d="M644 430V373"/><text x="655" y="394" font-size="17" font-weight="400" class="mono">final</text><text x="42" y="596" font-size="19" font-weight="400" class="sub">The transaction owns internal commits. External effects keep their own authority and retry contract.</text></svg>