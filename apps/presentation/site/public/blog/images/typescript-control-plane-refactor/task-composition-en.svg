<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
  <title id="t">Long-horizon task primitives compose over one kernel</title>
  <desc id="d">Per-target conditional continuation, non-blocking background observation, and self-consistent replanning compose over a single TypeScript task state kernel backed by AuthorityStore and an append-only execution journal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0070f3"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <style>
    text { font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171717; }
    .sub { fill: #4d4d4d; }
    .blue { fill: #0070f3; }
    .on-dark { fill: #ffffff; }
    .on-dark-sub { fill: #e5e5e5; }
    .on-dark-sky { fill: #93c5fd; }
    .mono { font-family: "Geist Mono", "SFMono-Regular", monospace; }
    .box { fill: #fff; stroke: #d5d5d5; stroke-width: 1.2; }
    .box-hi { fill: #f3f8ff; stroke: #93c5fd; stroke-width: 1.4; }
    .kernel { fill: #171717; stroke: #171717; }
    .flow { fill: none; stroke: #0070f3; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>

  <text x="42" y="52" font-size="29" font-weight="600">Long-horizon task primitives compose over one kernel</text>
  <text x="42" y="86" font-size="17" class="sub">Per-target wakeups, isolated background watches, and lineage replans share atomic revisions and leases</text>

  <!-- Primitive 1: conditional wakeup & continuation -->
  <rect class="box" x="42" y="114" width="320" height="160" rx="12"/>
  <text x="62" y="144" font-size="12" font-weight="500" class="mono blue">WAKEUP · #4094 #6874 #8231 #9488</text>
  <text x="62" y="174" font-size="18.5" font-weight="600">Per-target continuation</text>
  <text x="62" y="203" font-size="14.5" class="sub">Full-graph readiness read (#6874)</text>
  <text x="62" y="228" font-size="14.5" class="sub">Per-target wakeups, &lt;=128 (#8231)</text>
  <text x="62" y="253" font-size="14.5" class="sub">Cross-lease continuation (#9488)</text>

  <!-- Primitive 2: background observation -->
  <rect class="box" x="390" y="114" width="320" height="160" rx="12"/>
  <text x="410" y="144" font-size="12" font-weight="500" class="mono blue">MONITOR · #4178 #4335 #5450 #9320</text>
  <text x="410" y="174" font-size="18.5" font-weight="600">Non-blocking observation</text>
  <text x="410" y="203" font-size="14.5" class="sub">Edits keep done watches off (#4178)</text>
  <text x="410" y="228" font-size="14.5" class="sub">Quiet vs. bound receipts (#5450)</text>
  <text x="410" y="253" font-size="14.5" class="sub">Isolated watch sessions (#9320)</text>

  <!-- Primitive 3: lineage-preserving replan -->
  <rect class="box" x="738" y="114" width="320" height="160" rx="12"/>
  <text x="758" y="144" font-size="12" font-weight="500" class="mono blue">REPLAN · #4902 #5698 #8588 #8854</text>
  <text x="758" y="174" font-size="18.5" font-weight="600">Self-consistent replanning</text>
  <text x="758" y="203" font-size="14.5" class="sub">Atomic swap + lease release (#5698)</text>
  <text x="758" y="228" font-size="14.5" class="sub">Keep trigger on watch exit (#8854)</text>
  <text x="758" y="253" font-size="14.5" class="sub">Settle turn before stop (#8588)</text>

  <!-- Arrows into TS Kernel -->
  <path class="flow" d="M202 274 V308"/>
  <path class="flow" d="M550 274 V308"/>
  <path class="flow" d="M898 274 V308"/>

  <!-- Central TypeScript Kernel -->
  <rect class="kernel" x="42" y="314" width="1016" height="116" rx="12"/>
  <text x="66" y="350" font-size="20" font-weight="600" class="on-dark">TypeScript Task State Kernel</text>
  <text x="66" y="380" font-size="15" class="on-dark-sub">Evaluates task dependencies (#6874), goal wait coverage (#7298), and replan settlement in one state machine</text>
  <text x="66" y="408" font-size="13.5" class="mono on-dark-sky">Invariants: revision CAS · 3h lease-epoch fencing (#9487) · self-referential trigger &amp; stop-order safety</text>

  <!-- Arrows into Storage & Journal -->
  <path class="flow" d="M290 430 V462"/>
  <path class="flow" d="M810 430 V462"/>

  <!-- Bottom Left: AuthorityStore -->
  <rect class="box-hi" x="42" y="468" width="494" height="106" rx="12"/>
  <text x="66" y="501" font-size="18" font-weight="600">Transactional State Store (AuthorityStore)</text>
  <text x="66" y="529" font-size="14.5" class="sub">Atomic state head, active leases, archive &amp; receipts</text>
  <text x="66" y="555" font-size="13" class="mono sub">#3798 · #4121 · #5805 · #7834</text>

  <!-- Bottom Right: Execution Journal -->
  <rect class="box" x="564" y="468" width="494" height="106" rx="12"/>
  <text x="588" y="501" font-size="18" font-weight="600">Append-Only Execution Journal</text>
  <text x="588" y="529" font-size="14.5" class="sub">Two-phase external effect preflight &amp; crash recovery</text>
  <text x="588" y="555" font-size="13" class="mono sub">#3416 · #3464 · #3485</text>

  <text x="42" y="610" font-size="16" class="sub">Composing task primitives on one typed state machine eliminates cross-turn deadlocks missed by isolated happy paths.</text>
</svg>
