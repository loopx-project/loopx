<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
  <title>Differential Delivery: Reuse Within an Epoch, Full Recovery on Break</title>
  <desc>Within continuity epoch A, baseline is followed by verified delta 1 and delta 2. On compaction or continuity break, epoch B automatically resets with a fresh full baseline.</desc>
  
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; fill: #0f172a; }
  .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .muted { fill: #475569; }
  .subtle { fill: #64748b; }
  .accent { fill: #1d4ed8; }
  .emerald { fill: #047857; }
  .amber { fill: #b45309; }
  .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
  .card-accent { fill: #f8fafc; stroke: #93c5fd; stroke-width: 1.8; }
  .card-emerald { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.8; }
  .card-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.8; }
  .pill { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
  .divider { stroke: #e2e8f0; stroke-width: 1.5; }
</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#f1f5f9"/>
  </linearGradient>
  <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2563eb"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="slateBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#475569"/>
  </linearGradient>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/>
  </marker>
</defs>

  <rect width="1200" height="620" fill="url(#bgGrad)"/>
  <text x="48" y="64" font-size="34" font-weight="800">Differential Delivery: Reuse Within an Epoch, Full Recovery on Break</text>

  <!-- Epoch A -->
  <rect x="48" y="96" width="1104" height="176" rx="16" class="card"/>
  <text x="76" y="136" font-size="20" font-weight="700" class="accent">Continuity Epoch A (Active Session with Verified Baseline)</text>
  <rect x="76" y="156" width="300" height="92" rx="12" class="card-accent"/>
  <text x="98" y="194" font-size="20" font-weight="700">Full Baseline</text>
  <text x="98" y="224" font-size="15" class="muted mono">Persisted with baseline_sha256</text>
  <line x1="384" y1="202" x2="430" y2="202" stroke="#2563eb" stroke-width="2.5"/><polygon points="428,196 440,202 428,208" fill="#2563eb"/>

  <rect x="444" y="156" width="300" height="92" rx="12" class="card-emerald"/>
  <text x="466" y="194" font-size="20" font-weight="700" class="emerald">Verified Delta Δ1</text>
  <text x="466" y="224" font-size="15" class="muted">Baseline hash matched → changed fields</text>
  <line x1="752" y1="202" x2="798" y2="202" stroke="#2563eb" stroke-width="2.5"/><polygon points="796,196 808,202 796,208" fill="#2563eb"/>

  <rect x="812" y="156" width="308" height="92" rx="12" class="card-emerald"/>
  <text x="834" y="194" font-size="20" font-weight="700" class="emerald">Verified Delta Δ2</text>
  <text x="834" y="224" font-size="15" class="muted">Tracks structural diffs &amp; removals</text>

  <!-- Continuity Break Banner -->
  <rect x="140" y="294" width="920" height="54" rx="27" class="card-amber"/>
  <text x="600" y="328" font-size="18" font-weight="700" class="amber" text-anchor="middle">Context Compaction / Session Switch / Hash Mismatch → Rejects Dangling Delta, Forces Full</text>

  <!-- Epoch B -->
  <rect x="48" y="370" width="1104" height="176" rx="16" class="card"/>
  <text x="76" y="410" font-size="20" font-weight="700" class="emerald">Continuity Epoch B (Fresh Baseline After Compaction / Break)</text>
  <rect x="76" y="430" width="300" height="92" rx="12" class="card-accent"/>
  <text x="98" y="468" font-size="20" font-weight="700">Full Baseline</text>
  <text x="98" y="498" font-size="15" class="muted mono">Persisted with baseline_sha256</text>
  <line x1="384" y1="476" x2="430" y2="476" stroke="#2563eb" stroke-width="2.5"/><polygon points="428,470 440,476 428,482" fill="#2563eb"/>

  <rect x="444" y="430" width="300" height="92" rx="12" class="card-emerald"/>
  <text x="466" y="468" font-size="20" font-weight="700" class="emerald">Verified Delta Δ1</text>
  <text x="466" y="498" font-size="15" class="muted">Baseline hash matched → changed fields</text>

  <text x="48" y="586" font-size="17" class="subtle">Guarantees exact structural reconstruction at every turn: never floods unchanged blobs, never references a compacted baseline.</text>
</svg>