<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>通用长程能力，是 RSI 的先决条件</title><rect width="1200" height="630" fill="#fafafa"/><g font-family="PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="56" y="55" fill="#0070f3" font-size="20" font-weight="600">LOOPX / SELF-IMPROVEMENT</text><text x="56" y="143" fill="#171717" font-size="62" font-weight="600">通用长程能力</text><text x="56" y="217" fill="#171717" font-size="62" font-weight="600">是 RSI 的先决条件</text><text x="56" y="273" fill="#4d4d4d" font-size="25">用改善后的系统，继续改善系统。</text><line x1="56" y1="313" x2="1144" y2="313" stroke="#ddd"/><text x="56" y="436" fill="#171717" font-size="100" font-weight="600">6,848</text><text x="380" y="399" fill="#171717" font-size="28">个非合并提交</text><text x="380" y="440" fill="#666" font-size="22">2026.05.31–10.01 · 公开 Git 历史</text><text x="56" y="510" fill="#0070f3" font-size="27" font-weight="600">Meta 自举 → 通用长程系统 → 工作区与社区</text><text x="56" y="582" fill="#666" font-size="19">Ruiteng Huang · 系统级自迭代，不是模型权重训练</text></g></svg>
