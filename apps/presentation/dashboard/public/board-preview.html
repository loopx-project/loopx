<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LoopX board preview</title>
<link rel="stylesheet" href="/board-preview.css">
<style>body{margin:0;background:#fbfaf7} .personal-workspace-shell{display:block;min-height:auto} .wrap{width:1384px;margin:0 auto;padding:24px 28px} .personal-task-kanban{grid-template-columns:repeat(4,minmax(0,1fr))} .personal-task-board{padding:0}</style>
</head><body><div class="personal-workspace-shell" data-pw-theme="loopx"><main class="personal-workspace-main"><div class="wrap">
<div class="personal-task-board">
  <header class="personal-task-view-toolbar">
    <div><strong>Tasks</strong></div>
    <label class="personal-task-search"><input type="search" placeholder="Search tasks" aria-label="Search tasks"></label>
    <label class="personal-task-filter"><select aria-label="Task state filters"><option>All</option><option>Needs a decision</option><option>Open</option><option>Blocked and deferred</option><option>Done</option></select></label>
    <div class="personal-task-view-switch" role="group"><button type="button">List</button><button type="button" aria-pressed="true">Board</button></div>
  </header>
  <div class="personal-task-kanban">
    <section class="personal-object-list personal-task-lane">
      <header><strong><i aria-hidden="true" class="personal-kanban-dot tone-attention"></i>Needs your confirmation</strong><span>0</span></header>
      <div class="personal-task-lane-scroll"><p class="personal-task-empty">No needs your confirmation.</p></div>
    </section><section class="personal-object-list personal-task-lane">
      <header><strong><i aria-hidden="true" class="personal-kanban-dot tone-progress"></i>Queued / Running</strong><span>2</span></header>
      <div class="personal-task-lane-scroll"><button type="button"><span aria-hidden="true">!</span><strong>确认第 5 批清理清单（3 个零引用辅助函数）</strong><small><span class="personal-row-status is-blocking">待确认</span><span class="personal-task-age">18 天</span></small></button>
<button type="button"><span aria-hidden="true">!</span><strong>是否退役 TR-C 目标：源注册表缺失且状态文件不存在</strong><small><span class="personal-row-status is-blocking">待确认</span><span class="personal-task-age">18 天</span></small></button></div>
    </section><section class="personal-object-list personal-task-lane">
      <header><strong><i aria-hidden="true" class="personal-kanban-dot tone-schedule"></i>Scheduled & continuous</strong><span>0</span></header>
      <div class="personal-task-lane-scroll"><p class="personal-task-empty">No scheduled & continuous.</p></div>
    </section><section class="personal-object-list personal-task-lane">
      <header><strong><i aria-hidden="true" class="personal-kanban-dot tone-done"></i>Completed</strong><span>2</span></header>
      <div class="personal-task-lane-scroll"><button type="button"><span aria-hidden="true">!</span><strong>删除 docker-compose.yml 中仅回滚保留的 cache 卷配置</strong><small><span class="personal-row-status is-pending">进行中</span><span class="personal-task-age">12 分钟</span></small></button>
<button type="button"><span aria-hidden="true">!</span><strong>统一数据版本表述：sstp110 / 本地缓存 / 论文正文</strong><small><span class="personal-row-status is-open">未开始</span><span class="personal-task-age">2 天</span></small></button></div>
    </section>
  </div>
</div>
</div></main></div></body></html>
