[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-codex-provider-routing"
version = "0.12.3"
description = "Native Codex account slots and exhausted-account handoff for LoopX"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
loopx-cpa-operator = "loopx_codex_provider_routing.operator:main"
loopx-codex-provider-routing = "loopx_codex_provider_routing.cli:main"
loopx-codex-accounts = "loopx_codex_provider_routing.native:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopx_codex_provider_routing = ["*.ts"]
