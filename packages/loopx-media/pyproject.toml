[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-media"
version = "0.3.0"
description = "Optional local composition renderer for LoopX content-ops"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "imageio-ffmpeg>=0.6,<0.7", "fonttools>=4,<5"]

[project.optional-dependencies]
blender = ["bpy==4.5.12"]

[project.scripts]
loopx-media = "loopx_media.renderer:main"

[tool.setuptools.packages.find]
where = ["src"]
