[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-finance-execution"
version = "0.1.1"
description = "Simulated finance operation consumer for LoopX confirmation flows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
loopx-finance-execution = "loopx_finance_execution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
