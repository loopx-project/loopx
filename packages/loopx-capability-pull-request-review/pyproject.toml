[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-capability-pull-request-review"
dynamic = ["version", "dependencies"]
description = "Built-in pull-request review implementation for a matching LoopX Core installation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requires-core.txt"}

[tool.setuptools.packages.find]
include = ["loopx", "loopx.cli_commands", "loopx.capabilities.pr_review_queue"]

[tool.setuptools.package-data]
"loopx.capabilities.pr_review_queue" = ["experiences/*/*/*.json", "experiences/*.md"]
