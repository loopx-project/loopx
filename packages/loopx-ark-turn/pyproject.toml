[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-ark-turn"
version = "0.1.0"
description = "Optional Ark Managed Agent host for independently validated LoopX Turns"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["arkruntime[mcp]>=0.8.0,<0.9", "mcp==1.30.0"]

[project.scripts]
loopx-ark-turn = "loopx_ark_turn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
