<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<text x="100" y="44" font-size="20" font-weight="700" fill="#111827">Replan 效率前沿：单次重规划开销 vs 有效跃升率</text>
<text x="100" y="70" font-size="13" fill="#4b5563">横轴：单次重规划平均 Token 开销 (k tokens)；纵轴：有效突破跃升概率 (Effective Jump Ratio)</text>
<!-- Axes -->
<line x1="100" y1="100" x2="100" y2="400" stroke="#4b5563" stroke-width="1.5"/>
<line x1="100" y1="400" x2="740" y2="400" stroke="#4b5563" stroke-width="1.5"/>
<text x="35" y="115" font-size="11" fill="#4b5563">跃升率 70%</text>
<text x="35" y="250.0" font-size="11" fill="#4b5563">跃升率 35%</text>
<text x="55" y="400" font-size="11" fill="#4b5563">0%</text>
<text x="100" y="424" font-size="11" fill="#4b5563">600k</text>
<text x="420.0" y="424" font-size="11" fill="#4b5563">1100k</text>
<text x="700" y="424" font-size="11" fill="#4b5563">1600k tokens</text>
<line x1="100" y1="325.0" x2="740" y2="325.0" stroke="#f3f4f6" stroke-width="1"/>
<line x1="100" y1="250.0" x2="740" y2="250.0" stroke="#f3f4f6" stroke-width="1"/>
<line x1="100" y1="175.0" x2="740" y2="175.0" stroke="#f3f4f6" stroke-width="1"/>
<line x1="100" y1="100.0" x2="740" y2="100.0" stroke="#f3f4f6" stroke-width="1"/>
<path d="M 537.8 351.1 Q 587.5 268.9, 285.6 132.1" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
<circle cx="537.8" cy="351.1" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="551.8" y="347.1" font-size="13" font-weight="700" fill="#dc2626">Explore-Off (11.4%)</text>
<text x="551.8" y="365.1" font-size="10" fill="#4b5563">微调陷阱：单次Replan高开销但跃升率仅11.4%</text>
<circle cx="618.4" cy="268.9" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
<text x="632.4" y="264.9" font-size="13" font-weight="700" fill="#16a34a">Explore-On (30.6%)</text>
<text x="632.4" y="282.9" font-size="10" fill="#4b5563">探索账本：开销略升，跃升率提升至30.6%</text>
<circle cx="285.6" cy="132.1" r="8" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>
<text x="299.6" y="128.1" font-size="13" font-weight="700" fill="#8b5cf6">Stride (62.5%)</text>
<text x="299.6" y="146.1" font-size="10" fill="#4b5563">自适应步长前沿：开销降36.9%，跃升率达62.5%</text>
<text x="100" y="480" font-size="11" fill="#6b7280">* 证明：纯粹堆叠 Replan 次数无法带来等比例性能提升；Stride 机制通过证据条件激活，实现了开销与有效跃升的最优前沿。</text>
</svg>