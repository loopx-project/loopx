<g transform="translate(70, 580)">
<rect x="0" y="0" width="960" height="80" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="24" y="28" font-size="13" font-weight="700" fill="#1f2937">因果归因核心发现 (Key Causal Findings):</text>
<text x="24" y="48" font-size="12" fill="#374151">1. 机械缩小步长 ("做小一点") 导致在局部次优解上陷入无效 Replan (Grid 9.5 小时原地微调，仅降低 1.7% 成本)。</text>
<text x="24" y="66" font-size="12" fill="#374151">2. 证据自适应 Stride 与严密候选门禁 (Incumbent Retention) 能跳出微调陷阱，并在后程劣质扰动时保住全局最高分。</text>
</g>
