name: Contributor task
description: Publish, claim, or discuss a public contributor task.
title: "[Task]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for public, repository-safe work. Do not paste private benchmark traces, verifier output, raw agent sessions, credentials, internal document links, or local runtime state.
  - type: input
    id: task_id
    attributes:
      label: Task ID or area
      description: Use the board ID if one exists, such as GH-C01, or a short area name.
      placeholder: "GH-C01 or area: docs"
  - type: dropdown
    id: direction
    attributes:
      label: Technical direction
      description: Choose the closest current program. This routes discussion; merged active RFCs are Accepted and claimable, while implementation evidence and authorization remain separate.
      options:
        - Core control-plane hardening
        - Long-horizon benchmark evidence
        - Operator surface and IM integration
        - Shared Goal Authority and cross-host coordination
        - Architecture and research incubator
        - Unsure; maintainer triage needed
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Intent
      options:
        - I want to claim an existing task
        - I am proposing a new task
        - I need design feedback before implementation
        - I found a bug
    validations:
      required: true
  - type: dropdown
    id: anchor_type
    attributes:
      label: Anchor type
      description: Curated board work needs its canonical anchor. Ordinary self-contained contributions may use a reproduced defect, accepted request or concrete maintenance outcome without a pre-existing issue or RFC.
      options:
        - Roadmap stream / milestone / card (S, G, R) in loopx-overall-roadmap-v0
        - Accepted RFC section or invariant
        - Reproduced adoption defect (public issue from a real install, run, upgrade or host)
        - Self-contained reproduced defect, accepted request or maintenance outcome
        - None yet; I am asking whether this should become a task
    validations:
      required: true
  - type: input
    id: anchor_ref
    attributes:
      label: Optional anchor reference
      description: Required for curated board work; optional for an ordinary self-contained contribution. Cite the exact card, RFC section or public issue when one exists.
      placeholder: "R1 · \"confirmed commitments survive materialization\" / shared-goal-authority-state-provider-v0 §D2 / #4941"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Gap, who is blocked, and exit
      description: Name the current request or contract, the user or caller blocked without this change, the observable result after it, and the condition that closes the task.
      placeholder: |
        Current gap:
        Who is blocked without it:
        Accepted outcome (before → after):
        Exit condition:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Choose a complete useful slice. State ownership, dependencies, non-goals and any staged remainder; do not split only to minimize file or PR size.
      placeholder: |
        In scope / owner:
        Existing related work / dependencies:
        Out of scope:
        If staged: useful delta, remaining gap, next owner/task, and why this boundary:
    validations:
      required: true
  - type: input
    id: target_base
    attributes:
      label: Intended base branch
      description: Usually main. Name an integration branch when the direction tracker requires one.
      placeholder: "main or frontend-control-plane-im-prototype-rfc"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files or commands
      description: Link likely files, docs, examples, or CLI commands.
      placeholder: |
        - README.md
        - examples/demo-cli-smoke.py
        - loopx check --scan-root .
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What independently observable result proves completion? Include the actual entrypoint/readback and relevant failure case; passing a test count is insufficient.
      placeholder: |
        Accepted result and independent oracle:
        Actual entrypoint / safe command:
        Negative or recovery case:
        Frontend / Lark / CLI impact or verified N/A:
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Public/private boundary
      options:
        - label: This issue does not include private benchmark traces, verifier output, credentials, internal document links, raw agent sessions, or local runtime state.
          required: true
        - label: I will not run or duplicate maintainer-owned benchmark cases unless a maintainer explicitly splits out a public task.
          required: true
        - label: This task is not a standalone catalog entry, behavior-pinning test, fixture dimension, rename, or docs restatement; if it includes one, the anchor above names the code, test, or copy that consumes it.
          required: true
