name: Signed Desktop Updates

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/desktop_*'
      - '.github/workflows/desktop-updater.yml'
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-desktop-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'release' && 'stable' || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/loopx-control-plane/src-tauri -> target
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python3 scripts/desktop_runtime_bundle.py
      - run: python3 -m unittest discover -s tests/desktop -p 'test_*.py'
      - run: cargo test --locked && cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/desktop/loopx-control-plane/src-tauri
  windows-desktop-tests:
    # The lifecycle and update regressions behind the signed Windows updater
    # are Windows-native (service job objects, `ShellExecuteW`, real child
    # processes) and cannot execute on the macOS `validate` leg. Compile the
    # whole test target natively and run those regressions here.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The signed runtime bundle the crate's build script embeds has to exist
      # before the test target can compile, exactly as on the macOS leg.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python scripts/desktop_runtime_bundle.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/loopx-control-plane/src-tauri -> target
          key: desktop-update-windows-tests
      - run: cargo test --locked --lib -- service_lifecycle
        working-directory: apps/desktop/loopx-control-plane/src-tauri
  identity:
    if: github.repository == 'loopx-project/loopx' && ((github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) || (github.event_name != 'release' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.identity.outputs.ref }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            channel="$(python3 scripts/desktop_update_feed.py --classify-release "$RELEASE_TAG" --prerelease "$IS_PRERELEASE")"
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "channel=main" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-main.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "tag=desktop-main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi
  build-macos:
    needs: identity
    if: needs.identity.outputs.channel == 'stable' || needs.identity.outputs.channel == 'main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/loopx-control-plane/src-tauri -> target
      - run: npm ci
        working-directory: apps/desktop/loopx-control-plane
      - name: Build signed macOS App and exact bundled runtime
        if: runner.os == 'macOS'
        working-directory: apps/desktop/loopx-control-plane
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ needs.identity.outputs.version }}
          BUNDLE: app
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run build -- --bundles "$BUNDLE" --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true,\"macOS\":{\"signingIdentity\":\"-\"}}}"
      - name: Collect native updater artifacts
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          mkdir -p dist/updater
          find apps/desktop/loopx-control-plane/src-tauri/target/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec cp {} dist/updater/ \;
          for artifact in dist/updater/*-setup.exe*; do
            if [ -f "$artifact" ]; then
              case "$artifact" in
                *-updater-setup.exe*) continue ;;
              esac
              mv "$artifact" "${artifact/-setup.exe/-updater-setup.exe}"
            fi
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The feed advertises this run's version. An installer whose name
            # does not embed it would be published under a version it does not
            # carry, and clients would never update again.
            ls dist/updater/*"$VERSION"*-updater-setup.exe >/dev/null
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: signed-updater-macos-15
          path: dist/updater/*
          if-no-files-found: error
  build-windows:
    needs: identity
    # Windows NSIS ships on the main channel only. Keeping this leg out of the
    # stable dependency graph means a Windows failure cannot withhold the
    # Darwin-only stable feed; main still requires it.
    if: needs.identity.outputs.channel == 'main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/loopx-control-plane/src-tauri -> target
      - run: npm ci
        working-directory: apps/desktop/loopx-control-plane
      - name: Build signed Windows NSIS updater installer
        if: runner.os == 'Windows'
        working-directory: apps/desktop/loopx-control-plane
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VERSION: ${{ needs.identity.outputs.version }}
          BUNDLE: nsis
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run build -- --bundles "$BUNDLE" --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
      - name: Collect native updater artifacts
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          mkdir -p dist/updater
          find apps/desktop/loopx-control-plane/src-tauri/target/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec cp {} dist/updater/ \;
          for artifact in dist/updater/*-setup.exe*; do
            if [ -f "$artifact" ]; then
              case "$artifact" in
                *-updater-setup.exe*) continue ;;
              esac
              mv "$artifact" "${artifact/-setup.exe/-updater-setup.exe}"
            fi
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The feed advertises this run's version. An installer whose name
            # does not embed it would be published under a version it does not
            # carry, and clients would never update again.
            ls dist/updater/*"$VERSION"*-updater-setup.exe >/dev/null
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: signed-updater-windows-latest
          path: dist/updater/*
          if-no-files-found: error
  publish:
    needs: [identity, build-macos, build-windows, validate, windows-desktop-tests]
    # A skipped Windows build is valid only on stable, where the feed is
    # Darwin-only. A main release must have its Windows artifact.
    if: >-
      always()
      && needs.identity.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.validate.result == 'success'
      && needs.windows-desktop-tests.result == 'success'
      && (needs.identity.outputs.channel != 'main' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: signed-updater-*
          path: dist/updater
          merge-multiple: true
      - name: Generate complete feed
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          CHANNEL: ${{ needs.identity.outputs.channel }}
        run: python scripts/desktop_update_feed.py --directory dist/updater --version "$VERSION" --tag "$RELEASE_TAG" --channel "$CHANNEL"
      - name: Upload immutable artifacts, publish channel pointer last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_REF: ${{ needs.identity.outputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL: ${{ needs.identity.outputs.channel }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          python - "$VERSION" "$RELEASE_TAG" "$CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.desktop_update_feed import build

          version, tag, channel = sys.argv[1:]
          if channel == "stable":
              expected_tag = "v" + version
          elif channel == "main" and version.startswith("0.0.0-main."):
              expected_tag = "desktop-main-" + version.removeprefix("0.0.0-main.").replace(".", "-")
          else:
              raise SystemExit("invalid desktop release identity")
          if tag != expected_tag or json.loads(Path("dist/updater/desktop-updater.json").read_text()) != build(Path("dist/updater"), version, tag, channel):
              raise SystemExit("desktop release feed does not match its identity and artifacts")
          PY
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          verify_ref() {
            local actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
            if [ "$actual" != "$SOURCE_REF" ]; then
              echo "::error::Desktop release tag does not match the build commit" >&2
              return 1
            fi
          }
          if ! gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$tmpdir/release-probe"; then
            if [ "$EVENT_NAME" != release ] && grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$tmpdir/release-probe"; then
              if gh api --include "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" > "$tmpdir/tag-probe"; then
                verify_ref
              elif ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$tmpdir/tag-probe"; then
                echo "::error::Cannot inspect desktop release tag $RELEASE_TAG" >&2
                exit 1
              fi
              gh release create "$RELEASE_TAG" --prerelease --target "$SOURCE_REF" --title "Desktop main $SOURCE_REF" --notes "Signed App and matching runtime preview."
            else
              echo "::error::Cannot inspect desktop release $RELEASE_TAG" >&2
              exit 1
            fi
          fi
          read_assets() {
            local release_id tag="$1"
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            remote_assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].name')"
          }
          check_asset() {
            local artifact="$1" name matches
            name="${artifact##*/}"
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
            matches="$(LC_ALL=C grep -Fixc -- "$name" <<<"$remote_assets" || true)"
            asset_exists=0
            if [ "$matches" -eq 0 ]; then return; fi
            if [ "$matches" -ne 1 ] || ! grep -Fxq -- "$name" <<<"$remote_assets"; then
              echo "::error::Desktop release asset name collision: $name" >&2
              return 1
            fi
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$tmpdir" --clobber
            if ! cmp -s "$artifact" "$tmpdir/$name"; then
              echo "::error::Desktop release asset differs: $name" >&2
              return 1
            fi
            asset_exists=1
          }
          artifacts=(dist/updater/*.gz dist/updater/*.sig dist/updater/*.exe)
          feed=dist/updater/desktop-updater.json
          verify_ref
          read_assets "$RELEASE_TAG"
          # Reject every conflict before uploading any missing file.
          for artifact in "${artifacts[@]}" "$feed"; do check_asset "$artifact"; done
          for artifact in "${artifacts[@]}"; do
            name="${artifact##*/}"
            if ! grep -Fxq -- "$name" <<<"$remote_assets"; then
              gh release upload "$RELEASE_TAG" "$artifact"
            fi
          done
          read_assets "$RELEASE_TAG"
          for artifact in "${artifacts[@]}"; do
            check_asset "$artifact"
            if [ "$asset_exists" -ne 1 ]; then echo "::error::Missing uploaded desktop artifact" >&2; exit 1; fi
          done
          check_asset "$feed"
          if [ "$asset_exists" -eq 0 ]; then gh release upload "$RELEASE_TAG" "$feed"; fi
          read_assets "$RELEASE_TAG"
          for artifact in "${artifacts[@]}" "$feed"; do
            check_asset "$artifact"
            if [ "$asset_exists" -ne 1 ]; then echo "::error::Incomplete desktop release" >&2; exit 1; fi
          done
          verify_ref
          # Channel pointers are independent of repository Latest, which also
          # serves separately versioned plugin releases. Advance only after the
          # immutable signed assets and feed are completely uploaded.
          pointer="desktop-$CHANNEL"
          if ! gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$pointer" > "$tmpdir/pointer-probe"; then
            if grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$tmpdir/pointer-probe"; then
              gh release create "$pointer" --prerelease --latest=false --target "$SOURCE_REF" --title "Desktop $CHANNEL channel" --notes "Pointer to the latest complete signed desktop build."
            else
              echo "::error::Cannot inspect desktop channel $pointer" >&2
              exit 1
            fi
          fi
          read_assets "$pointer"
          pointer_assets="$remote_assets"
          pointer_matches="$(LC_ALL=C grep -Fixc desktop-updater.json <<<"$pointer_assets" || true)"
          if [ "$pointer_matches" -gt 1 ] || { [ "$pointer_matches" -eq 1 ] && ! grep -Fxq desktop-updater.json <<<"$pointer_assets"; }; then
            echo "::error::Desktop channel feed name collision" >&2
            exit 1
          fi
          decision=advance
          if grep -Fxq desktop-updater.json <<<"$pointer_assets"; then
            mkdir -p dist/current-pointer
            gh release download "$pointer" --pattern desktop-updater.json --dir dist/current-pointer --clobber
            if cmp -s dist/current-pointer/desktop-updater.json dist/updater/desktop-updater.json; then
              decision=retain
            else
              decision="$(python scripts/desktop_update_feed.py \
                --channel-pointer-decision "$CHANNEL" \
                --current-feed dist/current-pointer/desktop-updater.json \
                --candidate-feed dist/updater/desktop-updater.json)"
            fi
          fi
          if [ "$decision" = advance ]; then
            gh release upload "$pointer" dist/updater/desktop-updater.json --clobber
          else
            echo "::notice title=Desktop channel retained::$pointer already points to an equal or newer build"
          fi
