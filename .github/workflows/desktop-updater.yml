name: Signed Desktop installation qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-macos:
    if: github.repository == 'loopx-project/loopx'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '2.4.1'
      SOURCE_REVISION: a69abea06be4bc02735cd8083c5f99fc6f007611
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch the immutable App from its completed signing step
        run: |
          set -euo pipefail
          mkdir -p originals candidate dist
          gh release download v2.4.0 --repo "$GITHUB_REPOSITORY" --pattern LoopX.app.tar.gz --dir originals
          gh run download 45211516676 --repo "$GITHUB_REPOSITORY" --name signed-updater-macos-15 --dir candidate
          shasum -a 256 originals/LoopX.app.tar.gz candidate/LoopX.app.tar.gz
      - name: Round-trip signed activation, native reopen and backup
        run: |
          python3 examples/release/qualify-signed-desktop.py originals/LoopX.app.tar.gz candidate/LoopX.app.tar.gz "$SOURCE_REVISION" "$VERSION" dist/desktop-activation.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-activation-qualification
          path: dist/desktop-activation.json
          if-no-files-found: error
