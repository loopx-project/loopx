name: Publish DSH Plugin to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published DSH plugin release tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-plugin-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'loopx-project/loopx' && ((github.ref_type == 'tag' && github.ref_name == inputs.release_tag) || (github.ref == 'refs/heads/main' && startsWith(inputs.release_tag, 'dsh-loopx-plugin-v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-loopx-plugin
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a merged, published release with matching package identity
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, mkdirSync, readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG, `dsh-loopx-plugin-v${manifest.version}`)
          mkdirSync('output', { recursive: true })
          appendFileSync(process.env.GITHUB_ENV, `DSH_ARTIFACT=./output/${manifest.name}-${manifest.version}.tgz\n`)
          NODE
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft > output/release.json
          node -e 'const r=require("./output/release.json"); require("node:assert/strict").equal(r.isDraft, false)'
      - name: Download the immutable GitHub package
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$DSH_ARTIFACT")" --dir output
          tar -xOf "$DSH_ARTIFACT" package/package.json > output/manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          const source = JSON.parse(readFileSync('package.json', 'utf8'))
          const packed = JSON.parse(readFileSync('output/manifest.json', 'utf8'))
          for (const field of ['name', 'version', 'main', 'exports', 'dsh', 'peerDependencies', 'repository', 'keywords']) {
            assert.deepEqual(packed[field], source[field], `release artifact ${field} differs from its tag`)
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(source.name)}`, {
            signal: AbortSignal.timeout(15_000),
          })
          assert(response.ok || response.status === 404, `registry lookup failed: HTTP ${response.status}`)
          const exists = response.ok && !!(await response.json()).versions?.[source.version]
          appendFileSync(process.env.GITHUB_ENV, `DSH_ALREADY_PUBLISHED=${exists}\n`)
          NODE
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const source = JSON.parse(readFileSync('package.json', 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(source.name)}`, {
            signal: AbortSignal.timeout(15_000),
          })
          const missing = response.status === 404
          const body = response.ok ? await response.json() : null
          const versions = Object.keys(body?.versions ?? {})
          const stagingOnly = versions.length > 0 && versions.every(v => v === '0.0.0-stage') && !versions.includes(source.version)
          appendFileSync(process.env.GITHUB_ENV, `DSH_NPM_PACKAGE_MISSING=${missing}\nDSH_NPM_STAGING_PLACEHOLDER=${stagingOnly}\n`)
          NODE
      - name: Publish the same bytes with npm trusted publishing
        if: env.DSH_ALREADY_PUBLISHED != 'true'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error title=GitHub OIDC unavailable::The hosted runner did not provide a GitHub OIDC request. Check the publish job's id-token permission."
            exit 1
          fi
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT
          set +e
          npm publish "$DSH_ARTIFACT" --access public --tag latest --ignore-scripts --provenance --loglevel=verbose > "$publish_log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Describe the stage without printing the trace, which can include an OIDC request URL.
            if grep -Fq 'Successfully retrieved and set token' "$publish_log"; then
              echo "::notice title=npm publish stage::npm accepted the workflow identity. Publishing the immutable archive failed afterward."
            elif grep -Fq 'Failed token exchange request' "$publish_log"; then
              echo "::notice title=npm publish stage::GitHub supplied an identity but npm rejected its token exchange."
            elif grep -Fq 'Failed to fetch id_token from GitHub' "$publish_log"; then
              echo "::notice title=npm publish stage::GitHub did not return an OIDC identity to npm."
            fi
            if [ "${DSH_NPM_PACKAGE_MISSING:-false}" = "true" ]; then
              echo "::error title=npm package bootstrap required::dsh-loopx-plugin returns HTTP 404 on registry.npmjs.org. npm OIDC Trusted Publishing cannot create a brand-new package: enable 2FA (auth-and-writes), run one-time web-auth 'npm publish <release.tgz> --access public --tag latest --ignore-scripts', run 'npm logout', then bind Trusted Publisher (loopx-project / loopx / dsh-plugin-publish.yml / blank Environment name / Allow npm publish checked)."
            elif [ "${DSH_NPM_STAGING_PLACEHOLDER:-false}" = "true" ]; then
              echo "::error title=npm package staging scan active::registry.npmjs.org still holds 0.0.0-stage from initial publish scan; wait 1-3 minutes for the target version to activate and re-dispatch."
            else
              echo "::error title=npm Trusted Publisher failed::Verify npmjs Trusted Publisher settings on https://www.npmjs.com/package/dsh-loopx-plugin/access (Provider: GitHub Actions, Organization or user: loopx-project, Repository: loopx, Workflow filename: dsh-plugin-publish.yml, Environment name: empty, Allow npm publish: checked)."
            fi
            exit "$rc"
          fi
          echo "Published the immutable GitHub archive to npm."
      - name: Read back npm bytes, latest, and marketplace repository discovery
        run: |
          if git cat-file -e origin/main:packages/dsh-loopx-plugin/scripts/verify-distribution.mjs 2>/dev/null; then
            git show origin/main:packages/dsh-loopx-plugin/scripts/verify-distribution.mjs > scripts/verify-distribution.mjs
          fi
          node scripts/verify-distribution.mjs --tarball "$DSH_ARTIFACT"
