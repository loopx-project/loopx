site_name: LoopX
site_description: Documentation for the LoopX stateful control plane for long-running AI agents, including installation, runtime integrations, goals, tasks, approval gates and recovery.
site_url: https://loopx-project.github.io/loopx/docs/
repo_url: https://github.com/loopx-project/loopx
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: output/docs-site
use_directory_urls: true
exclude_docs: |
  /README.md
  archive/**
  book/**
  research/long-horizon-agent-benchmarks/*.json
  showcases/**/*.html
  showcases/showcase-animation-prototype.html
  showcases/showcase-catalog.json

theme:
  name: material
  logo: assets/loopx-logo.png
  favicon: assets/loopx-logo.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-2
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_capability_pages.py

hooks:
  - docs/rewrite_capability_links.py

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

